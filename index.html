/* 点が動くのは章のマネージャー承認のときだけ。その一瞬にだけ動きを使う。 */
let toastTimer = null;
function celebrate(gained, code){
  let box = document.getElementById("toast");
  if (!box){
    box = document.createElement("div");
    box.id = "toast";
    box.setAttribute("role","status");
    document.body.appendChild(box);
  }
  const pt = pointsOf(code);
  const crew = findCrew(code);
  const g = crew && crew.isStaff ? null : gradeAt(pt);

  box.innerHTML = "";
  box.appendChild(el("div","big", "+" + gained + " pt"));
  box.appendChild(el("div","sub", "合計 " + pt + " 点"));

  if (g){
    const before = gradeAt(pt - gained).grade;
    if (before !== g.grade) box.appendChild(el("div","rank", g.grade + " に到達"));
    else if (g.next) box.appendChild(el("div","rank",
      g.next + "まで あと " + (g.nextAt - pt) + " 点"));
  }

  box.classList.add("show");
  if (navigator.vibrate) navigator.vibrate(gained >= 50 ? [18,60,18] : 18);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("show"), 2600);
}

/* ================= エクスポート =================
   紙(印刷) … 店舗の端末から印刷し、それを見ながらスコアカードとパーソナル
              レコードに書き写す。期間内にマネージャー承認した章だけを出す。
   Excel    … SALSAの 個人別実績 / 個人別実績_ヘルプ へ取り込む。
              こちらは期間ではなく「終了日時点の全部」(スナップショット)。 */

/* スコアカードの日付は 西暦下2桁/月/日。例 24/1/15 */
function scoreDate(iso){
  if (!iso) return "";
  const p = iso.split("-");
  return p[0].slice(2) + "/" + Number(p[1]) + "/" + Number(p[2]);
}
function shiftDays(iso, n){
  const t = new Date(iso + "T00:00:00");
  t.setDate(t.getDate() + n);
  return isoOf(t);
}
function shiftMonths(iso, n){
  const t = new Date(iso + "T00:00:00");
  t.setMonth(t.getMonth() + n);
  return isoOf(t);
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
/* 前回どこまで出したか。次回の開始日を自動で入れるために覚えておく。 */
function lastExportEnd(v){
  if (v === undefined){
    const r = Store.crewPatch("__period");
    return r && typeof r.end === "string" ? r.end : null;
  }
  Store.crewPatch("__period", {end: v});
}

/* その人の章承認。from/to は省略可(null で制限なし)。本の並び順のまま返す。 */
function approvalsOf(code, from, to){
  const out = [];
  for (const bu of MASTER.bu){
    for (const ch of bu.chapters){
      for (const lv of ["basic","advance"]){
        if (lv === "advance" && !ch.hasAdvance) continue;
        const a = chApproval(code, ch.code, lv);
        if (!a || !a.d) continue;
        if (from && a.d < from) continue;
        if (to && a.d > to) continue;
        out.push({bu, ch, lv, d: a.d, by: a.by || null,
                  pt: lv === "basic" ? (ch.basicMaxPt || 0) : (ch.advanceMaxPt || 0)});
      }
    }
  }
  return out;
}
function ptSum(list){ return list.reduce((s, a) => s + a.pt, 0); }

/* 部ごとのポイント(パーソナルレコードの転記先)。終了日時点で数える。 */
function buPointsAsOf(code, to){
  const m = new Map(MASTER.bu.map(b => [b.code, 0]));
  for (const a of approvalsOf(code, null, to)) m.set(a.bu.code, m.get(a.bu.code) + a.pt);
  return m;
}
/* ---- 評価月 ---- */
/* 評価月の決め方は店舗によって違う(変更している店舗もある)ため、
   プログラムに埋め込まず設定として持つ。設定は端末に残り、名簿を入れ直しても消えない。
   既定は「LD以下=入社月から4か月ごと(年3回) / AS1以上=3月・9月 / TRYは初回だけ」。 */
const EVAL_DEFAULT = {
  base: "hired",        // "hired"=入社月から数える / "fixed"=決まった月
  span: 3,              // 何か月ごとか。3なら年4回で、クルーは3つの組に分かれる
                        // (1・4・7・10 / 2・5・8・11 / 3・6・9・12)
  months: [3, 6, 9, 12],// fixed のときの評価月
  seniorSame: false,    // AS1以上もLD以下と同じ扱いにするか
  seniorMonths: [3, 9], // AS1以上の評価月
};
function evalConf(patch){
  if (patch !== undefined){ Store.crewPatch("__eval", patch); return; }
  return Object.assign({}, EVAL_DEFAULT, Store.crewPatch("__eval") || {});
}
function parseMonths(t){
  const z = String(t || "").replace(/[０-９]/g,
    ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  const ns = (z.match(/\d+/g) || []).map(Number).filter(n => n >= 1 && n <= 12);
  return Array.from(new Set(ns)).sort((a, b) => a - b);
}
function monthsLabel(list){ return list.map(m => m + "月").join("・"); }
/* クルーが何組に分かれるか(既定は3組)と、1人あたり年に何回あるか(既定は4回)。
   会社の決まりが変わったら EVAL_DEFAULT.span だけ直せばよい。 */
function evalGroups(){ return evalConf().span; }
function evalPerYear(){ return Math.round(12 / evalConf().span); }
const EVAL_SENIOR_SPAN = 6;   // AS1以上は年2回
/* 等間隔の組み合わせを全部作る。4か月ごとなら 1・5・9 / 2・6・10 / 3・7・11 / 4・8・12 の
   4通りしかないので、カンマ入力にせず選ぶだけにする。 */
function monthSets(span){
  const out = [];
  for (let start = 1; start <= span; start++){
    const set = [];
    for (let m = start; m <= 12; m += span) set.push(m);
    out.push(set);
  }
  return out;
}
function monthChoices(span, current){
  const sets = monthSets(span).map(monthsLabel);
  const now = monthsLabel(current);
  if (sets.indexOf(now) < 0 && current.length) sets.unshift(now);
  return {options: sets, value: now};
}
function pad2(n){ return String(n).padStart(2, "0"); }

/* TRYはLD以下にまとめて同じ扱いにする(格付が付く前も、付いた後も同じ数え方)。 */
function isSeniorGrade(c){ return /^(AS|PT)/.test(c.grade || ""); }
/* CSVで入ってきた入社年月日を優先し、無ければ端末で手入力したものを使う。 */
function hiredOf(c){
  return c.hiredOn || c.hiredAt || c.joinedOn || c.hiredManual || "";
}
function monthsFrom(hired, y, mo){
  const p = hired.split("-");
  return (y - Number(p[0])) * 12 + (mo - Number(p[1]));
}
/* その年月がその人の評価月か。"評価月" / "—" / "不明" / "対象外" を返す。 */
function evalStateOn(c, y, mo){
  const cf = evalConf();
  if (c.isStaff) return {state:"対象外"};
  const senior = isSeniorGrade(c) && !cf.seniorSame;
  const hired = hiredOf(c);

  let hit = false, nth = null;
  if (senior){
    hit = cf.seniorMonths.indexOf(mo) >= 0;
  } else if (cf.base === "fixed"){
    hit = cf.months.indexOf(mo) >= 0;
  } else {
    if (!hired) return {state:"不明"};
    const d = monthsFrom(hired, y, mo);
    hit = d > 0 && d % cf.span === 0;
    nth = hit ? d / cf.span : null;
  }
  if (!hit) return {state:"—"};
  return {state:"評価月", nth: nth, first: nth === 1};
}
function evalStateOnISO(c, iso){
  const p = iso.split("-");
  return evalStateOn(c, Number(p[0]), Number(p[1]));
}
/* 期間のうち、評価月として見る月。
   終了日の月は必ず見る。加えて、まるごと期間に入っている月も見る。
   ミーティングが月の中旬にあり期間が 8/16〜9/15 のような切り方でも、
   9月だけが対象になり二重に出ない。1か月飛ばして 7/16〜9/15 と出したときは、
   まるごと入っている8月も拾うので、評価月の人を取りこぼさない。 */
function monthLastDay(y, m){ return new Date(y, m, 0).getDate(); }
function evalMonthsInPeriod(from, to){
  const out = [];
  const f = from.split("-").map(Number), t = to.split("-").map(Number);
  let y = f[0], m = f[1];
  for (let i = 0; i < 60; i++){
    const first = y + "-" + pad2(m) + "-01";
    const last = y + "-" + pad2(m) + "-" + pad2(monthLastDay(y, m));
    const isLast = (y === t[0] && m === t[1]);
    if (isLast || (first >= from && last <= to)) out.push(y + "-" + pad2(m));
    if (isLast) break;
    m++; if (m > 12){ m = 1; y++; }
  }
  return out;
}
/* 期間のどこかで評価月に当たるか。当たった月も返す。 */
function evalStateInPeriod(c, from, to){
  let unknown = false;
  for (const ym of evalMonthsInPeriod(from, to)){
    const p = ym.split("-");
    const st = evalStateOn(c, Number(p[0]), Number(p[1]));
    if (st.state === "評価月") return Object.assign({month: Number(p[1])}, st);
    if (st.state === "不明") unknown = true;
  }
  return {state: unknown ? "不明" : "—"};
}

/* 次に評価月が来る年月。見つからなければ null。 */
function nextEvalMonth(c, iso){
  const p = iso.split("-");
  let y = Number(p[0]), mo = Number(p[1]);
  for (let i = 0; i < 48; i++){
    if (evalStateOn(c, y, mo).state === "評価月") return y + "-" + pad2(mo);
    mo++; if (mo > 12){ mo = 1; y++; }
  }
  return null;
}
/* いまの決め方を1行で。紙にも刷って、他店と見比べられるようにする。 */
function evalRuleText(){
  const cf = evalConf();
  const low = cf.base === "hired"
    ? "入社月から数えて年" + evalPerYear() + "回"
    : monthsLabel(cf.months);
  const sen = cf.seniorSame ? "同じ" : monthsLabel(cf.seniorMonths);
  return "評価月: LD以下 " + low + " / AS1以上 " + sen;
}

/* ---- 紙面を組む ---- */
/* 1人分。承認した章(期間内)と、部ごとポイント(終了日時点)を並べる。 */
function personBlock(m, to, tag){
  const c = m.c, bp = buPointsAsOf(c.code, to), hired = hiredOf(c);
  let h = '<div class="person"><div class="who"><b>' + esc(c.name || "(氏名なし)")
        + (c.isOwnStore === false ? "(ヘルプ)" : "") + "</b>"
        + (tag ? '<span class="tag">' + esc(tag) + "</span>" : "")
        + '<span>' + esc(c.code) + " ・ " + esc(c.position || c.grade || "格付未設定")
        + " ・ 入社 " + (hired ? scoreDate(hired) : "未登録") + "</span>"
        + '<span class="gain">' + (m.gained ? "+" + m.gained + "pt → " : "")
        + "合計 " + m.total + "pt</span></div>";

  if (m.inP.length){
    h += "<table>"
       + '<col style="width:20%"><col style="width:35%"><col style="width:16%">'
       + '<col style="width:7%"><col style="width:14%"><col style="width:8%">'
       + "<thead><tr><th>部</th><th>章</th><th>区分</th><th class=\"num\">pt</th>"
       + "<th>承認日</th><th>転記</th></tr></thead><tbody>";
    for (const a of m.inP){
      h += "<tr><td>" + esc(a.bu.code + " " + a.bu.name) + "</td>"
         + "<td>" + esc(a.ch.code + " " + a.ch.name) + "</td>"
         + "<td>" + (a.lv === "basic" ? "Basic" : "Advance") + "</td>"
         + '<td class="num">' + a.pt + "</td>"
         + '<td class="date">' + scoreDate(a.d) + "</td><td></td></tr>";
    }
    h += "</tbody></table>";
  } else {
    h += '<div class="quiet">' + (m.total
      ? "この期間に承認した章はありません。スコアカードに書き足すものはありません。"
      : "この期間に承認した章はなく、ポイントもまだありません。") + "</div>";
  }

  /* パーソナルレコード用: 部ごとの積み上げと合計(終了日時点)。
     まだ1点も入っていない人は、0が並ぶ表を出しても書き写すものが無いので
     1行で済ませる(入社まもない人が評価月に重なるとこうなる)。 */
  if (!m.total) return h + "</div>";

  /* 12列あるので、ラベル列を狭くして残りを均等に割る */
  let r1 = '<col style="width:9%">'
         + MASTER.bu.map(() => '<col style="width:7.2%">').join("")
         + '<col style="width:11%"><tr><th>部</th>';
  let r2 = "<tr><th>pt</th>";
  for (const bu of MASTER.bu){
    r1 += "<th>" + esc(bu.code) + "</th>";
    r2 += "<td>" + bp.get(bu.code) + "</td>";
  }
  r1 += '<th class="tot">合計</th></tr>';
  r2 += '<td class="tot">' + m.total + "</td></tr>";
  return h + '<table class="pr">' + r1 + r2 + "</table></div>";
}

function reportHTML(from, to){
  const crews = allCrew().filter(c => c.active !== false);
  const recs = crews.map(c => {
    const inP = approvalsOf(c.code, from, to);
    return {c, inP, gained: ptSum(inP), total: ptSum(approvalsOf(c.code, null, to)),
            ev: evalStateInPeriod(c, from, to)};
  });
  const byGain = (a, b) => b.gained - a.gained || b.total - a.total;
  const evalNow = recs.filter(r => r.ev.state === "評価月").sort(byGain);
  const moved   = recs.filter(r => r.ev.state !== "評価月" && r.inP.length).sort(byGain);
  const still   = recs.filter(r => r.ev.state !== "評価月" && !r.inP.length)
                      .sort((a, b) => b.total - a.total);
  const unknown = recs.filter(r => r.ev.state === "不明");
  const emonths = evalMonthsInPeriod(from, to);
  const monthLabel = emonths.map(ym => Number(ym.split("-")[1]) + "月").join("・");

  let h = '<div class="paper">';
  h += '<h2>' + esc(STORE.code + " " + STORE.name) + ' SALUTE 承認一覧</h2>';
  h += '<div class="meta">期間 ' + scoreDate(from) + " 〜 " + scoreDate(to)
     + "  /  出力 " + scoreDate(today())
     + "  /  この期間に承認した章 " + recs.reduce((s, m) => s + m.inP.length, 0) + "件"
     + "  /  " + monthLabel + "が評価月 " + evalNow.length + "名</div>";
  h += '<div class="meta">' + esc(evalRuleText()) + "</div>";
  h += '<div class="hint">承認日はスコアカードにそのまま書き写せる形(年/月/日)です。'
     + "書き写したら右端の欄にチェックを入れてください。</div>";
  if (unknown.length){
    h += '<div class="hint">入社年月日が未登録のため評価月を判定できない人がいます: '
       + esc(unknown.map(r => r.c.name).join("、"))
       + "(クルーの画面から入れられます)</div>";
  }

  if (evalNow.length){
    h += '<div class="grp">' + monthLabel + "が評価月のクルー"
       + '<span>パーソナルレコードに部ごとポイントを書き写す</span></div>';
    for (const m of evalNow){
      const tag = emonths.length > 1
        ? m.ev.month + "月" + (m.ev.first ? "・初回評価" : "評価")
        : (m.ev.first ? "初回評価" : "評価月");
      h += personBlock(m, to, tag);
    }
  }
  if (moved.length){
    h += '<div class="grp">この期間に伸びたクルー<span>'
       + moved.length + "名</span></div>";
    for (const m of moved) h += personBlock(m, to, null);
  }

  if (still.length){
    h += '<div class="grp">この期間に動きのなかった人<span>'
       + still.length + "名</span></div>";
    h += '<div class="quiet">転記するものはありません。ミーティングで見るための一覧です。</div>';
    h += "<table>"
       + '<col style="width:26%"><col style="width:17%"><col style="width:13%">'
       + '<col style="width:28%"><col style="width:16%">'

      const nx = nextEvalMonth(s.c, to);

         + (s.c.isOwnStore === false ? "(ヘルプ)" : "") + "</td>"
         + "<td>" + esc(s.c.position || s.c.grade || "") + "</td>"
         + '<td class="num">' + s.total + "</td>"
         + "<td>" + (last ? scoreDate(last) + "(" + daysSince(last) + "日前)" : "記録なし")
         + "</td>"
         + "<td>" + (s.c.isStaff ? "対象外"
                    : nx ? Number(nx.split("-")[1]) + "月" : "不明") + "</td></tr>";

/* ---- Excel(SALSA取り込み用) ---- */
/* 外部ライブラリを入れずに .xlsx を作る。圧縮せずに格納するだけのzipで、
   文字列はすべて inlineStr で書く(sharedStringsを持たなくて済む)。 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/* 圧縮できる端末なら縮める。使えなければ無圧縮で入れる(どちらもzipとして正しい)。
   節別状況が数千行になるため、圧縮できるかどうかでファイルサイズが10倍違う。 */
async function deflateRaw(bytes){
  if (typeof CompressionStream !== "function") return null;
  try {
    const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(s).arrayBuffer());
  } catch (e){ return null; }
}
async function zipBlob(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), raw = enc.encode(f.data), crc = crc32(raw);
    const packed = await deflateRaw(raw);
    const data = packed || raw, method = packed ? 8 : 0;
    const lh = new Uint8Array(30 + name.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint16(8, method, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true); lv.setUint32(22, raw.length, true);
    lv.setUint16(26, name.length, true);
    lh.set(name, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(10, method, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true); cv.setUint32(24, raw.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, central.length, true); ev.setUint16(10, central.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [end]),
                  {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function colRef(n){
  let s = "", i = n + 1;
  while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; }
  return s;
}
function sheetXML(rows){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
        + '<sheetData>';
  rows.forEach((row, r) => {
    x += '<row r="' + (r + 1) + '">';
    row.forEach((v, c) => {
      if (v === null || v === undefined || v === "") return;
      const ref = colRef(c) + (r + 1);
      if (typeof v === "number") x += '<c r="' + ref + '"><v>' + v + "</v></c>";
      else x += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">'
              + esc(v) + "</t></is></c>";
    });
    x += "</row>";
  });
  return x + "</sheetData></worksheet>";
}
async function workbookBlob(sheets){
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const rel = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const files = [
    {name:"[Content_Types].xml", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i+1)
          + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + "</Types>"},
    {name:"_rels/.rels", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="' + rel + '/officeDocument" Target="xl/workbook.xml"/>'
      + "</Relationships>"},
    {name:"xl/workbook.xml", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="' + ns + '" xmlns:r="' + rel + '"><sheets>'
      + sheets.map((s, i) => '<sheet name="' + esc(s.name) + '" sheetId="' + (i+1)
          + '" r:id="rId' + (i+1) + '"/>').join("")
      + "</sheets></workbook>"},
    {name:"xl/_rels/workbook.xml.rels", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sheets.map((s, i) => '<Relationship Id="rId' + (i+1) + '" Type="' + rel
          + '/worksheet" Target="worksheets/sheet' + (i+1) + '.xml"/>').join("")
      + '<Relationship Id="rIdS" Type="' + rel + '/styles" Target="styles.xml"/>'
      + "</Relationships>"},
    {name:"xl/styles.xml", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<styleSheet xmlns="' + ns + '">'
      + '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>'
      + '<fills count="2"><fill><patternFill patternType="none"/></fill>'
      + '<fill><patternFill patternType="gray125"/></fill></fills>'
      + '<borders count="1"><border/></borders>'
      + '<cellStyleXfs count="1"><xf/></cellStyleXfs>'
      + '<cellXfs count="1"><xf xfId="0"/></cellXfs></styleSheet>'},
  ];
  sheets.forEach((s, i) => files.push(
    {name:"xl/worksheets/sheet" + (i+1) + ".xml", data: sheetXML(s.rows)}));
  return await zipBlob(files);
}

/* 章ごとのポイント(終了日時点)。SALSAの個人別実績はこの形で持っている。 */
function chapterPtAsOf(code, ch, to){
  let pt = 0;
  const b = chApproval(code, ch.code, "basic");
  if (b && b.d && b.d <= to) pt += ch.basicMaxPt || 0;
  if (ch.hasAdvance){
    const a = chApproval(code, ch.code, "advance");
    if (a && a.d && a.d <= to) pt += ch.advanceMaxPt || 0;
  }
  return pt;
}
/* 職位(C列)の書き方をSALSAに合わせる。SALSA側は ﾘｰﾃﾞｨﾝｸﾞ3 ｱｿｼｴｲﾄ2 のような
   半角カナで持っているため、格付コードのまま貼ると表記が混ざる。
   呼び名が違っていたら、この表の言葉だけ直せばよい。 */
const GRADE_LABEL = {T:"T", LD:"ﾘｰﾃﾞｨﾝｸﾞ", AS:"ｱｿｼｴｲﾄ", PT:"ﾊﾟｰﾄﾅｰ"};
function posLabel(c){
  if (c.position) return c.position;          // 社員はSALSAの役職をそのまま
  const g = (c.grade || "").toUpperCase();
  const m = g.match(/^(LD|AS|PT|T)(\d*)$/);
  if (!m) return c.grade || "";
  return (GRADE_LABEL[m[1]] || m[1]) + m[2];
}

/* ① 横持ち。個人別実績シートの見出しと同じ並びで、そのまま貼り付けられる。 */
function wideRows(list, to){
  const rows = [["従業員コード","氏名","職位"].concat(CHAPTERS.map(ch => ch.code))];
  for (const c of list){
    const r = [c.code, c.name || "", posLabel(c)];
    for (const ch of CHAPTERS) r.push(chapterPtAsOf(c.code, ch, to));
    rows.push(r);
  }
  return rows;
}
/* ② 章別の状況。全クルー×68章を、承認していない章も含めて1行ずつ出す。
   SALSAの SUB項目_タスクコード対応表 が章コードを鍵にしているので、
   タスク記号の時間帯ログと突き合わせるときはこのシートが受け口になる。 */
function chapterRows(list, to){
  const rows = [["従業員コード","氏名","区分","部コード","章コード","章名","状態",
                 "Advance有無","Basic承認日","Advance承認日","取得pt","合計満点"]];
  for (const c of list){
    for (const bu of MASTER.bu){
      for (const ch of bu.chapters){
        const b = chApproval(c.code, ch.code, "basic");
        const a = ch.hasAdvance ? chApproval(c.code, ch.code, "advance") : null;
        const bd = (b && b.d && b.d <= to) ? b.d : "";
        const ad = (a && a.d && a.d <= to) ? a.d : "";
        rows.push([c.code, c.name || "", c.isOwnStore === false ? "ヘルプ" : "自店",
                   bu.code, ch.code, ch.name,
                   ad ? "A済" : bd ? "B済" : "未",
                   ch.hasAdvance ? "有" : "無", bd, ad,
                   chapterPtAsOf(c.code, ch, to),
                   (ch.basicMaxPt || 0) + (ch.hasAdvance ? (ch.advanceMaxPt || 0) : 0)]);
      }
    }
  }
  return rows;
}

/* ③ 縦持ち。章の承認を1行ずつ。取り込みスクリプトで扱いやすい形。 */
function flatRows(list, to){
  const rows = [["従業員コード","氏名","区分","部コード","部名","章コード","章名",
                 "水準","ポイント","承認日","承認者コード"]];
  for (const c of list){
    for (const a of approvalsOf(c.code, null, to)){
      rows.push([c.code, c.name || "", c.isOwnStore === false ? "ヘルプ" : "自店",
                 a.bu.code, a.bu.name, a.ch.code, a.ch.name,
                 a.lv === "basic" ? "Basic" : "Advance", a.pt, a.d, a.by || ""]);
    }
  }
  return rows;
}
/* ④ 節単位(㊼④の仕様)。清掃項目のTR判定に使う。 */
function sectionRows(list, to){
  const rows = [["従業員コード","氏名","章コード","節コード","節名","状態","確定日"]];
  for (const c of list){
    for (const ch of CHAPTERS){
      const b = chApproval(c.code, ch.code, "basic");
      const a = ch.hasAdvance ? chApproval(c.code, ch.code, "advance") : null;
      const bOk = !!(b && b.d && b.d <= to), aOk = !!(a && a.d && a.d <= to);
      for (const sec of ch.sections){
        const codes = sec.viewpoints.map(v => v.code);
        const allAt = lv => codes.every(v => stageOf(c.code, v, lv) >= STAGE_MAX);
        let st = "未", d = "";
        if (aOk && allAt("advance")){ st = "A済"; d = a.d; }
        else if (bOk && allAt("basic")){ st = "B済"; d = b.d; }
        rows.push([c.code, c.name || "", ch.code,
                   codes.length ? codes[0].slice(0, 8) : ch.code,
                   sec.name || "", st, d]);
      }
    }
  }
  return rows;
}

/* ⑤ 名簿。入社年月日と評価月を持ち帰るためのもの。
   0-1準社員マスタに入社年月日の列を作るときは、このシートをそのまま使える。 */
function rosterRows(list, to){
  const rows = [["従業員コード","氏名","格付","職位","区分","入社年月日",
                 "入社年月日の出どころ","評価月判定","次の評価月","合計pt"]];
  for (const c of list){
    const csv = c.hiredOn || c.hiredAt || c.joinedOn || "";
    const manual = c.hiredManual || "";
    const ev = evalStateOnISO(c, to);
    const nx = nextEvalMonth(c, to);
    rows.push([c.code, c.name || "", c.grade || "", c.position || "",
               c.isOwnStore === false ? "ヘルプ" : "自店",
               csv || manual,
               csv ? "CSV" : (manual ? "SALUTEで入力" : ""),
               ev.state, nx || "", ptSum(approvalsOf(c.code, null, to))]);
  }
  return rows;
}

async function deliver(blob, filename){
  try {
    const file = new File([blob], filename, {type: blob.type});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: filename});
      return "共有しました";
    }
  } catch (e){
    if (e && e.name === "AbortError") return "やめました";
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  return "保存しました";
}

function exportWorkbook(to){

/* ================= SALSAの判定材料の取り込み =================
   SALSAは「繁忙時間帯にこの記号をこなしていた」という事実を出すだけで、
   承認はしない。店長がSALUTEの画面で見て、自分で承認する。
   章コードを鍵にする(SALSAの SUB項目_タスクコード対応表 と同じ粒度)。 */
function salsaHints(){
  const r = Store.crewPatch("__salsa");
  return (r && r.data) ? r.data : {};
}
function salsaImportedAt(){
  const r = Store.crewPatch("__salsa");
  return (r && r.at) ? r.at : null;
}
function hintOf(code, chCode){
  const h = salsaHints()[code];
  return h ? h[chCode] : null;
}
/* 画面に出す1行。SALSAが出せた項目だけを並べる。 */
function hintText(h){
  const parts = [];
  parts.push("繁忙時の実績" + (h.n ? " " + h.n + "回" : "あり"));
  if (h.mark) parts.push("記号" + h.mark);
  if (h.last) parts.push("直近 " + scoreDate(h.last) + (h.hour ? " " + h.hour + "時台" : ""));
  if (h.prod) parts.push(Number(h.prod).toLocaleString() + "円/人時");
  return parts.join(" ・ ");
}

/* 見出しの言葉は揺れやすいので、いくつかの書き方を受ける。 */
const HINT_KEYS = {
  code: ["従業員コード","コード","社員コード","code"],
  ch:   ["章コード","章","chapter","ch"],
  n:    ["回数","件数","回","n"],
  last: ["最終日","直近日","日付","date"],
  hour: ["時間帯","時","hour"],
  prod: ["人時売上高","実績人時売上高","生産性","productivity"],
  mark: ["記号","タスク記号","タスク","mark"],
};
function parseCsv(text){
  const rows = [];
  let row = [], cell = "", q = false;
  const t = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"' && t[i+1] === '"'){ cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
function applySalsaCsv(text){
  const rows = parseCsv(text);
  if (rows.length < 2) return {err:"中身が読めませんでした"};
  const head = rows[0].map(h => h.trim());
  const idx = {};
  for (const key of Object.keys(HINT_KEYS))
    idx[key] = head.findIndex(h => HINT_KEYS[key].indexOf(h) >= 0);
  if (idx.code < 0 || idx.ch < 0)
    return {err:"従業員コードと章コードの列が見つかりません"};

  const known = new Set(CHAPTERS.map(ch => ch.code));
  const roster = new Set(allCrew().map(c => c.code));
  const data = {};
  let n = 0, badCh = 0, badCode = 0;
  for (const r of rows.slice(1)){
    const code = (r[idx.code] || "").trim();
    const ch = (r[idx.ch] || "").trim();
    if (!code || !ch) continue;
    if (!known.has(ch)){ badCh++; continue; }
    if (!roster.has(code)){ badCode++; continue; }
    const get = k => idx[k] >= 0 ? String(r[idx[k]] || "").trim() : "";
    data[code] = data[code] || {};
    data[code][ch] = {n: Number(get("n")) || 0, last: get("last"), hour: get("hour"),
                      prod: Number(String(get("prod")).replace(/[^0-9.]/g, "")) || 0,
                      mark: get("mark")};
    n++;
  }
  Store.crewPatch("__salsa", {data: data, at: today()});
  return {n: n, people: Object.keys(data).length, badCh: badCh, badCode: badCode};
}
function askImportSalsa(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".csv,text/csv,text/plain";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const res = applySalsaCsv(String(rd.result || ""));
      openSheet({
        title: res.err ? "取り込めませんでした" : "取り込みました",
        note: res.err
          ? res.err + "\n見出しに 従業員コード と 章コード が要ります。"
          : res.n + "件 / " + res.people + "名ぶんを取り込みました。"
            + (res.badCh ? "\n知らない章コード " + res.badCh + "件は飛ばしました。" : "")
            + (res.badCode ? "\n名簿にない人 " + res.badCode + "件は飛ばしました。" : "")
            + "\n章の画面と承認のときに出ます。承認するかどうかは店長が決めてください。",
        okLabel: "閉じる", onOk: () => {},
      });
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* エクスポートの入口。期間は前回の続きから始める。 */

  openSheet({
    title: "エクスポート",
    note: last ? "前回は " + scoreDate(last) + " まで出しました。"
               : "初回です。既定では直近1か月を出します。",
    okLabel: "作る",
    fields: [
      {key:"from", label:"開始日", type:"date", value: from},
      {key:"to",   label:"終了日", type:"date", value: to,
       note:"ミーティングの区切りに合わせて変えてください"},
      {key:"kind", label:"やること",
       options:["印刷(スコアカード転記用)","Excel(SALSA取り込み用)",
                "取り込み(SALSAの判定材料)"],
       note: salsaImportedAt()
         ? "判定材料は " + scoreDate(salsaImportedAt()) + " に取り込み済み"
         : "判定材料はまだ取り込んでいません"},
    ],
    onOk: (v) => {
      if (v.kind.indexOf("取り込み") === 0){ setTimeout(askImportSalsa, 60); return; }
      if (!v.from || !v.to) return "期間を入れてください";
      if (v.from > v.to) return "開始日が終了日より後になっています";
      if (v.kind.indexOf("印刷") === 0) setTimeout(() => showReport(v.from, v.to), 60);
      else setTimeout(() => exportWorkbook(v.to), 60);
    },
  });
}

/* ---- 評価月の設定 ---- */
function renderSettings(){
  const cf = evalConf();
  const now = today(), month = Number(now.split("-")[1]);
  setHeader(STORE.code + " " + STORE.name, "評価月の決め方", "", true);
  $main.innerHTML = "";

  const rows = [
    {t:"LD以下(TRY・LD1〜3をまとめて)",
     v: cf.base === "hired" ? "入社月から数えて年" + evalPerYear() + "回"
                            : monthsLabel(cf.months),
     go: askEvalLow},
    {t:"AS1以上(AS・PT)",
     v: monthsLabel(cf.seniorMonths) + " ・ 入社月に関係なく決まっています",
     go: null},
  ];
  $main.appendChild(el("div","sec","決め方"));
  for (const r of rows){
    /* AS1以上は会社の決まりで、入社月に関係なく決まった月。店舗で変えるものでは
       ないので押せる行にしない(変えるときは EVAL_DEFAULT.seniorMonths を直す)。 */
    const row = el(r.go ? "button" : "div", "row");
    const body = el("div","body");
    body.appendChild(el("div","name", r.t));
    body.appendChild(el("div","sub", r.v));
    row.appendChild(body);
    if (r.go){ row.appendChild(chevron()); row.onclick = r.go; }
    $main.appendChild(row);
  }

  /* いまの決め方で誰が当たるのかを、その場で確かめられるようにする */
  const hit = allCrew().filter(c => c.active !== false
              && evalStateOn(c, Number(now.split("-")[0]), month).state === "評価月");
  $main.appendChild(el("div","sec", "この決め方だと " + month + "月は"));
  const box = el("div","empty");
  box.appendChild(el("b", null, hit.length ? hit.length + "名が評価月" : "評価月の人はいません"));
  if (hit.length) box.append(hit.map(c => c.name).join("、"));
  $main.appendChild(box);

  /* 入社年月日はここでまとめて入れる。クルーの画面には置かない
     (本人が見る画面なので、店長の作業を混ぜない)。 */
  const people = allCrew().filter(c => c.active !== false && !c.isStaff);
  const missing = people.filter(c => !hiredOf(c)).length;
  $main.appendChild(el("div","sec",
    "入社年月日" + (missing ? "(未登録 " + missing + "名)" : "")));
  for (const c of people){
    const h = hiredOf(c);
    const fromCsv = !!(c.hiredOn || c.hiredAt || c.joinedOn);
    const nx = nextEvalMonth(c, now);
    const row = el("button","row");
    const body = el("div","body");
    body.appendChild(el("div","name", c.name || c.code));
    const sub = el("div","sub");
    if (h){
      sub.append(scoreDate(h) + (fromCsv ? "(名簿)" : "(手入力)") + " ・ 次の評価月 "
                 + (nx ? Number(nx.split("-")[1]) + "月" : "不明"));
    } else {
      sub.appendChild(el("span","stale","未登録"));
      sub.append(isSeniorGrade(c)
        ? " ・ AS1以上なので判定には使いません"
        : evalConf().base === "fixed"
          ? " ・ 決まった月なので判定はできます"
          : " ・ 入社月から数えるため判定できません");
    }
    body.appendChild(sub);
    row.appendChild(body);
    row.appendChild(chevron());
    row.onclick = () => askHired(c, fromCsv);
    $main.appendChild(row);
  }

  const rst = el("button","switch danger","既定に戻す");
  rst.onclick = () => openSheet({
    title:"既定に戻す", danger:true, okLabel:"戻す",
    note:"LD以下=入社月から数えて年4回 / AS1以上=3月・9月 に戻します。",
    onOk: () => { evalConf(Object.assign({}, EVAL_DEFAULT)); },
  });
  $main.appendChild(rst);

}

function askEvalLow(){
  const cf = evalConf();
  openSheet({
    title: "LD以下の評価月",
    note: "TRY・LD1〜3の話です(AS1以上は " + monthsLabel(cf.seniorMonths)
        + " で固定)。クルーは" + evalGroups() + "組に分かれ、1人あたり年"
        + evalPerYear() + "回です。",
    okLabel: "保存する",
    fields: [
      {key:"base", label:"数え方",
       options:["入社月から数える","決まった月にする"],
       value: cf.base === "hired" ? "入社月から数える" : "決まった月にする"},
      Object.assign({key:"months",
                     label:"評価月(" + evalGroups() + "組のどれか)",
                     note:"どれも年" + evalPerYear() + "回です"},
                    monthChoices(cf.span, cf.months)),
    ],
    onOk: (v) => {
      const fixed = v.base.indexOf("決まった") === 0;
      evalConf({base: fixed ? "fixed" : "hired", months: parseMonths(v.months)});
    },
  });
}
/* ---- 遷移 ---- */
function back(){
  if (view.name === "viewpoints") view = {name:"chapter", crew:view.crew, bu:view.bu};
  else if (view.name === "todo") view = {name:"home", crew:view.crew};
  else if (view.name === "chapter") view = {name:"home", crew:view.crew};
  else if (view.name === "settings") view = {name:"crew"};
  else if (view.name === "crew"){
    const last = Store.lastCrew();
    const c = last ? findCrew(last) : null;
    view = c ? {name:"home", crew:c} : {name:"crew"};
  }
  render();
}
document.getElementById("back").onclick = back;

function render(){
  const y = $main.scrollTop;
  if (view.name === "crew") renderCrew();
  else if (view.name === "home") renderHome();
  else if (view.name === "todo") renderTodo();
  else if (view.name === "chapter") renderChapter();
  else if (view.name === "settings") renderSettings();
  else renderViewpoints();
  $main.scrollTop = y;
}
render();

/* オフラインで起動できるようにする。
   file:// で開いたときやServiceWorkerが使えない環境では、黙って何もしない。 */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
