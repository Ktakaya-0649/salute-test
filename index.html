<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E7145">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SALUTE">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>SALUTE 9999</title>
<style>
  :root{
    --ink:#22201D; --ink-2:#6B655C; --ink-3:#9A938A;
    --paper:#FFFFFF; --surface:#F6F5F2; --rule:#E3E0DA;
    --green:#1E7145; --green-soft:#E6F0E8; --green-dk:#175836;
    --red:#C8102E; --red-soft:#FDF2F4;
    --amber:#B9762A; --amber-soft:#FBF0E2;
    --blue:#2C5F8A; --blue-soft:#E7EFF6;
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    /* 端末標準の和文フォント。オフライン起動を優先し、Webフォントは読み込まない */
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",
                system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  [hidden]{display:none !important}

  /* ---- 画面構成: 固定ヘッダー + スクロール本文 ---- */
  #app{display:flex;flex-direction:column;height:100dvh}
  header{
    flex:0 0 auto; background:var(--green); color:#fff;
    padding:max(env(safe-area-inset-top),10px) 16px 11px;
  }
  .bar{display:flex;align-items:center;gap:12px;min-height:var(--tap)}
  .back{
    flex:0 0 auto;width:34px;height:34px;margin-left:-6px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;color:#fff;
  }
  .back:active{background:rgba(255,255,255,.18)}
  .titles{flex:1 1 auto;min-width:0}
  .eyebrow{font-size:12px;color:rgba(255,255,255,.72);letter-spacing:.02em}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.01em;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{flex:0 0 auto;font-size:13px;color:rgba(255,255,255,.86);font-variant-numeric:tabular-nums}
  /* 画面の下にボタンを並べると選ぶものが増えて迷うので、
     いつでも使うもの(書き出し・決め方)は見出しの右に小さく置く。 */
  .acts{flex:0 0 auto;display:flex;align-items:center;margin-left:4px;margin-right:-7px}
  .acts button{
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:9px;color:#fff;
  }
  .acts button:active{background:rgba(255,255,255,.18)}

  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
       padding-bottom:max(env(safe-area-inset-bottom),20px)}

  /* ---- 行 ---- */
  .row{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:13px 16px;min-height:var(--tap);text-align:left;
    border-bottom:1px solid var(--rule);
  }
  .row:active{background:var(--surface)}
  .row .body{flex:1 1 auto;min-width:0}
  .row .name{font-weight:600;letter-spacing:.01em}
  .row .sub{font-size:12.5px;color:var(--ink-2);margin-top:1px}
  /* 最終トレーニング日。しばらく動いていない人に気づけるようにする */
  .row .sub .recent{color:var(--green);font-weight:600}
  .row .sub .stale{color:var(--red);font-weight:600}
  .chev{flex:0 0 auto;color:var(--ink-3)}

  /* 部・章の見出し行 */
  .sec{padding:16px 16px 7px;font-size:12px;color:var(--ink-2);font-weight:600;
       background:var(--surface);border-bottom:1px solid var(--rule);
       box-shadow:inset 3px 0 0 var(--green)}

  /* ---- 進捗: 細いバー + 分数 ---- */
  .meter{display:flex;align-items:center;gap:10px;margin-top:7px}
  .track{flex:1 1 auto;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
  .fill{height:100%;background:var(--green);border-radius:2px}
  /* 分数は項目数。主役ではないので控えめに戻す */
  .frac{flex:0 0 auto;font-size:12px;color:var(--ink-2);
        font-variant-numeric:tabular-nums;white-space:nowrap}
  /* ポイントが主役。章を全部確定させると入る点数を大きく見せる */
  .pts{flex:0 0 auto;display:flex;align-items:baseline;gap:2px;
       white-space:nowrap;font-variant-numeric:tabular-nums}
  .pts em{font-style:normal;font-size:28px;font-weight:700;line-height:1;
          letter-spacing:-.02em;color:var(--ink-3)}
  .pts em.on{color:var(--green)}
  /* 分母(満点)は文脈。分子より小さく、控えめに */
  .pts s{text-decoration:none;font-size:13px;font-weight:700;color:var(--ink-3);
         letter-spacing:-.01em}
  .pts i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);
         letter-spacing:.02em}
  .pts i.on{color:var(--green)}

  /* ---- クルー行の10本バー(部ごとの到達度) ---- */
  /* 部が10あるという事実そのものを形にした一覧表示。
     縦棒の高さで「どの領域が育っていて、どこが空いているか」を一目で見せる。 */
  .gauge{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .gauge .frac{font-size:12px;line-height:1.1;color:var(--ink-3)}
  .gauge .frac b{font-size:22px;font-weight:700;color:var(--ink-3);letter-spacing:-.015em}
  .gauge .frac b.on{color:var(--green)}
  .profile{display:flex;align-items:flex-end;gap:2px;height:20px;flex:0 0 auto}
  .profile i{width:4px;background:var(--rule);border-radius:1px;display:block}
  .profile i.on{background:var(--green)}

  /* ---- 状態チップ ---- */
  .chips{flex:0 0 auto;display:flex;gap:6px;align-items:center}
  .chip{
    min-width:40px;height:30px;padding:0 9px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;letter-spacing:.02em;
    border:1px solid var(--rule);color:var(--ink-3);background:var(--paper);
  }
  .chip.s1{border-color:#E4C69B;background:var(--amber-soft);color:var(--amber)}
  .chip.s2{border-color:#B9CEE1;background:var(--blue-soft);color:var(--blue)}
  .chip.s3{border-color:transparent;background:var(--green);color:#fff}
  .chip.lv{min-width:26px;padding:0 6px;font-size:11px}
  .chip[disabled]{opacity:.35}
  .undo{
    flex:0 0 auto;width:32px;height:32px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  }
  .undo:active{background:var(--surface)}

  .vp{display:block;padding:13px 16px;border-bottom:1px solid var(--rule)}
  /* 差し戻された観点。赤は店のブランド色でもあるので、ここだけに使う */
  .vp.sent{background:var(--red-soft);box-shadow:inset 3px 0 0 var(--red)}
  .vp .backnote{
    margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff;
    border:1px solid #F0D3D8;font-size:12.5px;color:var(--ink-2);
  }
  .vp .backnote b{color:var(--red);font-weight:700}
  .sendback{
    flex:0 0 auto;height:32px;padding:0 12px;border-radius:16px;
    display:flex;align-items:center;font-size:12.5px;font-weight:600;
    color:var(--red);border:1px solid #EFC9CF;background:#fff;
  }
  .sendback:active{background:var(--red-soft)}
  .vp .text{font-size:14.5px;line-height:1.5}
  .vp .foot{display:flex;align-items:center;gap:10px;margin-top:9px}
  .vp .done{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .vp.is-done .text{color:var(--ink-2)}

  .empty{padding:56px 24px;text-align:center;color:var(--ink-2)}
  .empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}

  .mark{
    width:26px;height:26px;border-radius:8px;background:var(--red);
    box-shadow:0 0 0 2px rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .mark svg{display:block}

  /* ---- クルーのホーム: 点数と次の格付までの距離を主役にする ---- */
  .hero{padding:26px 20px 22px;border-bottom:1px solid var(--rule)}
  .hero .who{display:flex;align-items:baseline;gap:10px}
  .hero .who b{font-size:21px;font-weight:700;letter-spacing:.01em}
  .hero .who .retired{background:var(--red)}
  .hero .who span{
    font-size:12px;font-weight:700;letter-spacing:.03em;
    color:#fff;background:var(--green);padding:3px 9px;border-radius:10px;
  }
  .pt{display:flex;align-items:baseline;gap:8px;margin-top:14px}
  .pt em{font-style:normal;font-size:54px;font-weight:700;line-height:1;
         letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--green-dk)}
  .pt i{font-style:normal;font-size:15px;color:var(--ink-2)}
  .toNext{margin-top:12px;font-size:13.5px;color:var(--ink-2)}
  .toNext b{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
  /* 格付の道のり。現在地と次の到達点を1本の線で示す */
  .road{margin-top:10px;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
  .road div{height:100%;background:var(--green);border-radius:3px}
  .roadEnds{display:flex;justify-content:space-between;margin-top:5px;
            font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* 章に「あと◯項目で+◯点」を出す */
  .soon{font-size:12px;color:var(--green);font-weight:600;margin-top:3px}
  .earned{font-size:12px;color:var(--ink-3);margin-top:3px}

  .switch{
    display:block;width:100%;text-align:center;padding:16px;
    color:var(--ink-2);font-size:13.5px;border-top:1px solid var(--rule);
  }
  .switch:active{background:var(--surface)}
  .switch.danger{color:var(--red)}

  /* ---- 承認待ちのバッジ(クルー一覧) ---- */
  .badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;
    border-radius:11px;font-size:11.5px;font-weight:700;letter-spacing:.01em;
  }
  /* マネージャー承認待ちは「あと1タップで点が入る」ので緑で目立たせる */
  .badge.m{background:var(--green);color:#fff}
  /* トレーナー確認待ちは控えめに */
  .badge.t{background:var(--amber-soft);color:var(--amber);border:1px solid #E4C69B}

  /* ---- ホームの承認待ち(件数だけ) ---- */
  .todobar{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:14px 16px;border-bottom:1px solid var(--rule);background:var(--surface);
  }
  .todobar:active{filter:brightness(.97)}
  .todobar .txt{flex:1 1 auto;min-width:0}
  .todobar .t1{font-size:14px;font-weight:700}
  .todobar .t2{font-size:12.5px;color:var(--ink-2);margin-top:1px}

  /* ---- 承認待ちの一覧(クルーの画面) ---- */
  .todo{border-bottom:1px solid var(--rule)}
  .todo .head{
    display:flex;align-items:center;gap:8px;padding:14px 16px 8px;
    font-size:12.5px;color:var(--ink-2);
  }
  .todo .head b{font-size:13px;color:var(--ink)}
  .todo .item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:11px 16px;border-top:1px solid var(--rule);
  }
  .todo .item:active{background:var(--surface)}
  .todo .item .t1{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600}
  .todo .item .t2{font-size:12px;color:var(--ink-2);font-weight:400;margin-top:1px}
  .todo .item .pt2{
    flex:0 0 auto;font-size:13px;font-weight:700;color:var(--green);
    font-variant-numeric:tabular-nums;
  }
  .todo .item .left{
    flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--amber);
    font-variant-numeric:tabular-nums;
  }
  .todo .more{padding:10px 16px;font-size:12.5px;color:var(--ink-2);text-align:center}

  /* ---- 章のマネージャー承認 ---- */
  .mgr{padding:14px 16px;border-bottom:1px solid var(--rule);background:var(--surface)}
  .mgr .lv{display:flex;align-items:center;gap:10px;padding:7px 0}
  .mgr .lvname{font-size:13px;font-weight:700;flex:0 0 74px}
  .mgr .state{flex:1 1 auto;font-size:12.5px;color:var(--ink-2)}
  .mgr .state b{color:var(--green)}
  .mgr button{
    flex:0 0 auto;height:36px;padding:0 16px;border-radius:18px;
    background:var(--green);color:#fff;font-size:13px;font-weight:700;
  }
  .mgr button[disabled]{background:var(--rule);color:var(--ink-3)}
  /* 取り消しは矢印だけ。承認ボタンの緑を引き継がないよう打ち消す */
  .mgr .undo{width:32px;height:32px;padding:0;border-radius:16px;
             background:none;color:var(--ink-3)}
  .mgr .undo:active{background:var(--rule)}
  .mgr .done{
    flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--green);
    font-variant-numeric:tabular-nums;
  }

  /* ---- 一括入力モードの帯 ---- */
  .bulkbar{
    position:sticky;top:0;z-index:6;
    display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:var(--amber-soft);border-bottom:1px solid #E4C69B;
    font-size:12.5px;color:#7A4E14;
  }
  .bulkbar b{color:var(--amber)}
  .bulkbar button{
    margin-left:auto;flex:0 0 auto;height:30px;padding:0 12px;border-radius:15px;
    background:#fff;border:1px solid #E4C69B;color:var(--amber);
    font-size:12.5px;font-weight:700;
  }
  .vp .bulk{
    flex:0 0 auto;height:32px;padding:0 14px;border-radius:16px;
    background:var(--green);color:#fff;font-size:12.5px;font-weight:700;
  }

  /* ---- クルーの検索 ---- */
  .search{padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--paper);
          position:sticky;top:0;z-index:5}
  .search .box{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:12px;color:var(--ink-3);pointer-events:none}
  .search input{
    width:100%;height:42px;padding:0 40px 0 38px;font:inherit;font-size:16px;
    border:1px solid var(--rule);border-radius:21px;background:var(--surface);
    color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--green);outline-offset:-1px;
                      border-color:transparent;background:#fff}
  .search input::placeholder{color:var(--ink-3)}
  /* ブラウザが自前で付けるクリア・検索ボタンを消す。自前の✕と二重になるため */
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-decoration,
  .search input::-webkit-search-results-button,
  .search input::-webkit-clear-button,
  .search input::-ms-clear,
  .search input::-ms-reveal{display:none !important;appearance:none;width:0;height:0}
  .search .clear{
    position:absolute;right:6px;width:32px;height:32px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  }
  .search .clear:active{background:var(--rule)}

  /* ---- 入力シート(差し戻しの理由) ---- */
  /* window.prompt は環境によってブロックされるため、画面内で完結させる */
  #sheetbg{
    position:fixed;inset:0;background:rgba(34,32,29,.38);
    opacity:0;pointer-events:none;z-index:40;
  }
  #sheetbg.show{opacity:1;pointer-events:auto}
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;
    background:var(--paper);border-radius:18px 18px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);
    transform:translateY(102%);box-shadow:0 -10px 34px rgba(34,32,29,.18);
  }
  #sheet.show{transform:translateY(0)}
  #sheet h2{margin:0 0 4px;font-size:17px;font-weight:700}
  #sheet .target{
    font-size:13.5px;color:var(--ink-2);line-height:1.5;
    padding:10px 12px;background:var(--surface);border-radius:10px;margin:10px 0 14px;
  }
  #sheet label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
  #sheet input[type=text], #sheet select{
    width:100%;height:46px;padding:0 12px;font:inherit;font-size:16px;
    border:1px solid var(--rule);border-radius:10px;background:#fff;color:var(--ink);
  }
  #sheet input:focus, #sheet select:focus{
    outline:2px solid var(--green);outline-offset:-1px;border-color:transparent}
  #sheet .field{margin-bottom:12px}
  #sheet .note{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:2px}
  #sheet .confirm.danger{background:var(--red)}
  #sheet .confirm.go{background:var(--green)}
  #sheet textarea{
    width:100%;min-height:84px;padding:11px 12px;font:inherit;font-size:15px;
    border:1px solid var(--rule);border-radius:10px;resize:none;background:#fff;
    color:var(--ink);
  }
  #sheet textarea:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:transparent}
  #sheet .acts{display:flex;gap:10px;margin-top:16px}
  #sheet .acts button{
    flex:1 1 0;height:48px;border-radius:12px;font-size:15px;font-weight:700;
  }
  #sheet .cancel{border:1px solid var(--rule);color:var(--ink-2);background:#fff}
  #sheet .confirm{background:var(--red);color:#fff}
  @media (prefers-reduced-motion:no-preference){
    #sheetbg{transition:opacity .18s ease-out}
    #sheet{transition:transform .26s cubic-bezier(.16,1,.3,1)}
  }

  /* ---- 加点の瞬間 ---- */
  /* 章単位加算なので、点が動くのは「章の最後の1項目を確定した瞬間」だけ。
     その一瞬にだけ動きを使う。他の場面では一切アニメーションさせない。 */
  #toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);
    transform:translate(-50%,16px);opacity:0;pointer-events:none;
    background:var(--green);color:#fff;border-radius:18px;
    padding:14px 22px;text-align:center;
    box-shadow:0 8px 28px rgba(30,113,69,.32);
    max-width:min(86vw,340px);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast .big{font-size:27px;font-weight:700;line-height:1.15;
              letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  #toast .sub{font-size:13px;opacity:.92;margin-top:3px}
  #toast .rank{
    margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.3);
    font-size:14px;font-weight:700;letter-spacing:.02em;
  }
  @media (prefers-reduced-motion:no-preference){
    #toast{transition:opacity .2s ease-out,transform .24s cubic-bezier(.16,1,.3,1)}
  }

  @media (prefers-reduced-motion:no-preference){
    .fill,.road div{transition:width .22s ease-out}
  }

  /* ---- 転記用の紙面 ---- */
  /* 店舗の端末から印刷して、紙を見ながら本に書き写すためのもの。
     画面の緑は使わない(インクを食うだけで、紙の上では意味を持たない)。 */
  #printout{display:none}
  body.preview #app{display:none}
  body.preview #printout{
    display:block;position:fixed;inset:0;overflow-y:auto;background:#fff;
    -webkit-overflow-scrolling:touch;
  }
  .pbar{
    position:sticky;top:0;z-index:2;display:flex;gap:10px;column-gap:10px;
    padding:max(env(safe-area-inset-top),10px) 14px 10px;
    background:var(--green);
  }
  .pbar button{
    flex:1 1 0;height:44px;border-radius:11px;font-size:15px;font-weight:700;
    background:#fff;color:var(--green-dk);
  }
  .pbar button.ghost{background:rgba(255,255,255,.16);color:#fff}
  .pnote{position:sticky;top:64px;z-index:2;background:var(--green);
         color:rgba(255,255,255,.62);font-size:11px;padding:0 14px 8px;line-height:1.4}
  .paper{padding:18px 16px 60px;color:#000;max-width:760px;margin:0 auto}
  .paper h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em}
  .paper .meta{font-size:12.5px;color:#444;margin-top:3px}
  .paper .hint{font-size:12px;color:#666;margin-top:10px}
  .person{margin-top:22px;border-top:2px solid #000;padding-top:9px}
  /* 印刷経路によっては gap が効かないため、間隔は margin で作る */
  .person .who{display:flex;align-items:baseline;flex-wrap:wrap}

  .person .who b{font-size:16px}
  .person .who span{font-size:12.5px;color:#444}

  /* iPhoneの幅で見ると名前と合計がくっつくので、狭いときは合計を次の行に落とす。

  @media screen and (max-width:520px){
    .person .who{display:block}
    .person .who > * + *{margin-left:6px}
    .person .who .gain{display:block;margin-left:0;margin-top:2px;text-align:right}

  /* iPhoneの印刷は「画面の横幅で組んだものを紙に拡大」する。列が多い表が

  .paper table{width:100%;table-layout:fixed;border-collapse:collapse;
               margin-top:8px;font-size:12.5px}
  .paper table td,.paper table th{word-break:break-word;overflow-wrap:anywhere}

  .paper td.num,.paper th.num{text-align:right;font-variant-numeric:tabular-nums}
  .paper td.date{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  .paper .pr td,.paper .pr th{text-align:center;padding:3px 1px;font-size:11px;

  .paper .pr .tot{font-weight:700;background:#F3F3F3}
  /* SALSAからの判定材料。承認そのものではないので、緑にはしない。 */
  .row .body .busy{margin-top:3px;font-size:12px;color:#8A6D00;font-weight:600}
  .paper .quiet{font-size:12.5px;color:#444;margin-top:6px}
  .paper .grp{margin-top:26px;padding-bottom:4px;border-bottom:1px solid #000;

  .paper .grp span{margin-left:10px}
  .paper .grp span{font-weight:400;font-size:12px;color:#444}
  .person .who .tag{border:1px solid #000;border-radius:3px;padding:0 5px;
                    font-size:11.5px;font-weight:700;color:#000}

  @media print{
    body.preview #printout{position:static;overflow:visible}
    .pbar,.pnote{display:none}
    .paper{padding:0;max-width:none}
    .person{break-inside:avoid;page-break-inside:avoid}
    @page{size:A4;margin:12mm}
  }
</style>

sicMaxPt": 2, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 備品の交換", "viewpoints": [{"code": "04-16-01-1", "text": "使用してはいけない備品の水準を理解している"}]}]}]}, {"code": "05", "name": "プライオリティ", "chapters": [{"code": "05-01", "name": "1 知識", "basicMaxPt": 5, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 作業の優先順位の原則", "viewpoints": [{"code": "05-01-01-1", "text": "作業の優先順位を理解している"}, {"code": "05-01-01-2", "text": "作業が重複した場合の対応を理解している"}, {"code": "05-01-01-3", "text": "プライオリティにおける2つのルールを言える"}]}, {"name": "2 作業発生のタイミング", "viewpoints": [{"code": "05-01-02-1", "text": "作業が発生する音の種類と発生する作業を理解している"}, {"code": "05-01-02-2", "text": "入店やお帰りのお客様を見つけて声がけし、他の従業員に知らせている"}, {"code": "05-01-02-3", "text": "お客様を無視していない、そう受け止められる行為をしていない"}, {"code": "05-01-02-4", "text": "すぐに対応できない場合は、必ず「お待たせしました」と伝え対応している"}]}, {"name": "3 ポジションの考え方", "viewpoints": [{"code": "05-01-03-1", "text": "作業割り当て記号の見方を理解している"}, {"code": "05-01-03-2", "text": "コア作業とメイン作業、フォロー作業の違いを理解している"}, {"code": "05-01-03-3", "text": "当日の割り当てられたポジションのメイン作業を確認している"}, {"code": "05-01-03-4", "text": "メイン作業の順番に作業しつつも、サービング作業発生時には反応できる"}, {"code": "05-01-03-5", "text": "お互いアイコンタクトや声かけをして作業のの重複を事前に回避している"}]}]}, {"code": "05-02", "name": "2 初級", "basicMaxPt": 10, "advanceMaxPt": 20, "hasAdvance": true, "sections": [{"name": "1 基本の動き（ケース1）", "viewpoints": [{"code": "05-02-01-1", "text": "サービングとキャッシャーが同時に発生した場合はサービングを優先している"}, {"code": "05-02-01-2", "text": "一度持った料理を置いてキャッシャー作業を行っていない"}]}, {"name": "2 基本の動き（ケース2）", "viewpoints": [{"code": "05-02-02-1", "text": "クリーンアップとキャッシャーが重複した場合はクリーンアップを優先している"}, {"code": "05-02-02-2", "text": "正しい一時置き場の使い方ができる"}]}, {"name": "3 基本の動き（ケース3）", "viewpoints": [{"code": "05-02-03-1", "text": "料理が冷める可能性がある場合はサービングを優先している"}, {"code": "05-02-03-2", "text": "フロアに出たときにはついで作業をして戻っている"}]}]}, {"code": "05-03", "name": "3 中級", "basicMaxPt": 15, "advanceMaxPt": 30, "hasAdvance": true, "sections": [{"name": "1 基本の動き（ケース4）", "viewpoints": [{"code": "05-03-01-1", "text": "サービングとウェルカムが重複した場合に適切な対応をしている"}, {"code": "05-03-01-2", "text": "ウェルカムに時間がかかりそうな場合はサービングを優先している"}]}, {"name": "2 基本の動き（ケース5）", "viewpoints": [{"code": "05-03-02-1", "text": "オーダーが連続発生しているときの新規ご来店に対して適切な対応をしている"}, {"code": "05-03-02-2", "text": "ウェルカムに時間がかかりそうな場合はオーダーを優先している"}]}]}]}, {"code": "06", "name": "トレーニング", "chapters": [{"code": "06-01", "name": "1 知識", "basicMaxPt": 5, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 トレーニングの原則", "viewpoints": [{"code": "06-01-01-1", "text": "トレーニングの原則を理解している"}, {"code": "06-01-01-2", "text": "店舗のトレーニングに関する情報やトレーニング課題を理解している"}]}, {"name": "2 トレーナーの原則", "viewpoints": [{"code": "06-01-02-1", "text": "トレーナー自らが正確な作業と水準以上の作業スピードを習得している"}, {"code": "06-01-02-2", "text": "トレーニーに対して敬意を払い、丁寧に接している"}, {"code": "06-01-02-3", "text": "模範となるアピアランスや時間管理ができる"}, {"code": "06-01-02-4", "text": "トレーナーが行う業務のサイクルを理解して実施している"}]}]}, {"code": "06-02", "name": "2 準備", "basicMaxPt": 5, "advanceMaxPt": 10, "hasAdvance": true, "sections": [{"name": "1 トレーニング計画", "viewpoints": [{"code": "06-02-01-1", "text": "トレーニングを計画するツールの見方と使い方を理解している"}]}, {"name": "2 事前準備", "viewpoints": [{"code": "06-02-02-1", "text": "トレーニングする作業やゴール状態を確認してから実施している"}, {"code": "06-02-02-2", "text": "トレーニーの作業習得状況の確認を実施している"}]}]}, {"code": "06-03", "name": "3 実践", "basicMaxPt": 20, "advanceMaxPt": 40, "hasAdvance": true, "sections": [{"name": "1 トレーニングの実施手順", "viewpoints": [{"code": "06-03-01-1", "text": "トレーニングの開始前に、お客様の期待と目標の説明を行っている"}, {"code": "06-03-01-2", "text": "トレーニーの当日のトレーニング目標を設定している"}, {"code": "06-03-01-3", "text": "マニュアル通りの手順と動作の説明を行っている"}, {"code": "06-03-01-4", "text": "「説明しながら」と「基準となる作業スピード」の2つの手本を示している"}, {"code": "06-03-01-5", "text": "トレーニーの質問や疑問点を都度解消しながら進めている"}, {"code": "06-03-01-6", "text": "マニュアルの手順や動作と異なる点を発見し、適切なタイミングで修正している"}, {"code": "06-03-01-7", "text": "お客様に怪我や汚損など危険が及ぶ恐れがある状態でやらせていない"}, {"code": "06-03-01-8", "text": "トレーニーの作業の改善点に対してタイムリーかつ具体的に褒めている"}, {"code": "06-03-01-9", "text": "1時間あたりフィードバックを3回以上行っている"}, {"code": "06-03-01-10", "text": "トレーニングの最後にトレーニーの目標に対する振り返りを行っている"}, {"code": "06-03-01-11", "text": "トレーニングマニュアルチェックリストの見方と使い方を理解して実施している"}]}, {"name": "2 トレーニング実施後の報告", "viewpoints": [{"code": "06-03-02-1", "text": "終了後、トレーニング実施内容をストアマネジャーに報告している"}]}]}]}, {"code": "07", "name": "オープニング", "chapters": [{"code": "07-01", "name": "1 緊急連絡", "basicMaxPt": 4, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 関係者とフォロー体制", "viewpoints": [{"code": "07-01-01-1", "text": "どのような状況時に電話連絡するのか理解している"}, {"code": "07-01-01-2", "text": "『緊急時の初期対応・連絡先一覧』の掲示場所を知っている"}, {"code": "07-01-01-3", "text": "連絡先の優先順位を理解している"}]}]}, {"code": "07-02", "name": "2 実務", "basicMaxPt": 26, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 入店時管理", "viewpoints": [{"code": "07-02-01-1", "text": "駐車場・店舗外観の確認を手順通り実施している"}, {"code": "07-02-01-2", "text": "違法駐車、放置自転車がある場合、手順通り対応している"}, {"code": "07-02-01-3", "text": "店舗外観に異常がある場合の対応を理解している"}, {"code": "07-02-01-4", "text": "バックヤード開錠、警備解除、ガス元栓の開栓を手順通り実施している"}, {"code": "07-02-01-5", "text": "社内メール・通達を確認し、未確認情報の添付ファイルを印刷している"}, {"code": "07-02-01-6", "text": "仕込み量目安シートを印刷している"}, {"code": "07-02-01-7", "text": "レジの開店処理を手順通り実施している"}, {"code": "07-02-01-8", "text": "セーフティボックスを開けたままその場から離れていない"}, {"code": "07-02-01-9", "text": "レジ以外の場所で釣銭を取り扱っていない"}, {"code": "07-02-01-10", "text": "釣銭金と入金の差額がゼロでない場合の対応方法を理解している"}, {"code": "07-02-01-11", "text": "オーダー端末の台数カウントとマスタ受信を実施している"}, {"code": "07-02-01-12", "text": "『店舗運営管理記録表』の項目欄に記入している"}, {"code": "07-02-01-13", "text": "日計点検(ダブルチェック)を手順通り実施している"}]}, {"name": "2 開店前管理", "viewpoints": [{"code": "07-02-02-1", "text": "開店前作業を営業開始時刻までに漏れなく実施している"}, {"code": "07-02-02-2", "text": "設備・機器の稼働状況を確認し、『店舗運営管理記録表』に記入している"}, {"code": "07-02-02-3", "text": "設備・機器が基準を満たしていない場合、ストアマネジャーに報告している"}, {"code": "07-02-02-4", "text": "オープン前に来店されたお客様への対応を理解している"}, {"code": "07-02-02-5", "text": "クロージング作業に不備があった場合、ストアマネジャーに報告している"}]}]}]}, {"code": "08", "name": "クロージング", "chapters": [{"code": "08-01", "name": "1 緊急連絡", "basicMaxPt": 4, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 関係者とフォロー体制", "viewpoints": [{"code": "08-01-01-1", "text": "どのような状況時に電話連絡するのか理解している"}, {"code": "08-01-01-2", "text": "『緊急時の初期対応・連絡先一覧』の掲示場所を知っている"}, {"code": "08-01-01-3", "text": "連絡先の優先順位を理解している"}]}]}, {"code": "08-02", "name": "2 お客様対応", "basicMaxPt": 10, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 クロージング時のお客様対応", "viewpoints": [{"code": "08-02-01-1", "text": "在店中のお客様に対し、手順通りラストオーダーの確認を行っている"}, {"code": "08-02-01-2", "text": "ラストオーダー時刻以前にラストオーダー確認を行っていない"}, {"code": "08-02-01-3", "text": "ドリンクバーご利用中のお客様には利用終了時刻の説明を行っている"}, {"code": "08-02-01-4", "text": "ラストオーダーぎりぎりにご来店されたお客様をこころよくお迎えしている"}, {"code": "08-02-01-5", "text": "閉店時刻を過ぎたお客様に対して適切なタイミングでお声がけをしている"}]}]}, {"code": "08-03", "name": "3 実務", "basicMaxPt": 36, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 クロージング作業", "viewpoints": [{"code": "08-03-01-1", "text": "プレクロージング・クロージング作業を漏れなく実施している"}, {"code": "08-03-01-2", "text": "店内に食材カス・水たまり・ゴミがない状態でクロージング作業を終了している"}, {"code": "08-03-01-3", "text": "キッチンの設備・機器の電源をOFFにしている"}, {"code": "08-03-01-4", "text": "ガスの元栓と遮断弁を閉じている"}, {"code": "08-03-01-5", "text": "食材を冷蔵庫に収納し、コールドパンのフタを閉めている"}, {"code": "08-03-01-6", "text": "ロスの記録と入力を手順通り実施している"}, {"code": "08-03-01-7", "text": "店内・トイレにお客様がいないことを確認し、店舗入口の鍵を閉めている"}, {"code": "08-03-01-8", "text": "勤怠データ確定を手順通り実施している"}, {"code": "08-03-01-9", "text": "レジ精算を手順通り実施している"}, {"code": "08-03-01-10", "text": "セーフティボックスを開けたままその場から離れていない"}, {"code": "08-03-01-11", "text": "売上金の回収作業を手順通り実施している"}, {"code": "08-03-01-12", "text": "『オーダー端末』『勤怠端末』『業務端末』を充電し、所定の場所に保管している"}, {"code": "08-03-01-13", "text": "各種レポートを『稼働計画表』にルール通り貼付けている"}]}, {"name": "2 退店時管理", "viewpoints": [{"code": "08-03-02-1", "text": "『店舗運営管理記録表』の閉店時項目を確認し、記入している"}, {"code": "08-03-02-2", "text": "『責任者キー』をドロアー内に入れてドロアーを閉めている"}, {"code": "08-03-02-3", "text": "無断駐車車両がいる場合に手順通り対応している"}, {"code": "08-03-02-4", "text": "勤務終了から10分以内に複数人数で退出している"}, {"code": "08-03-02-5", "text": "警備セット・バックヤード施錠を手順通り実施している"}]}]}]}, {"code": "09", "name": "コントロール", "chapters": [{"code": "09-01", "name": "1 原則", "basicMaxPt": 10, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 コントロールの原則", "viewpoints": [{"code": "09-01-01-1", "text": "作業割当変更・作業指示を行うために必要な情報を収集している"}, {"code": "09-01-01-2", "text": "どのような状況時に作業割当の変更を行うのか理解している"}, {"code": "09-01-01-3", "text": "作業割当変更の原則を理解している"}, {"code": "09-01-01-4", "text": "3W2Hで作業割当の変更命令を出している"}, {"code": "09-01-01-5", "text": "作業指示の原則を理解している"}]}]}, {"code": "09-02", "name": "2 準備", "basicMaxPt": 10, "advanceMaxPt": 0, "hasAdvance": false, "sections": [{"name": "1 事前準備", "viewpoints": [{"code": "09-02-01-1", "text": "時間帯別の必須作業と完了予定時刻をストアマネジャーに事前に確認している"}, {"code": "09-02-01-2", "text": "当日の「トレーニング計画」をストアマネジャーに事前に確認している"}, {"code": "09-02-01-3", "text": "当日の「週課/月課の清掃・メンテナンス計画」を事前に確認している"}, {"code": "09-02-01-4", "text": "当日の「早出・延長依頼」の基準をストアマネジャーに事前に確認している"}]}]}, {"code": "09-03", "name": "3 実務", "basicMaxPt": 30, "advanceMaxPt": 30, "hasAdvance": true, "sections": [{"name": "1 ピーク前準備", "viewpoints": [{"code": "09-03-01-1", "text": "ピーク前準備の進行状況を確認している"}, {"code": "09-03-01-2", "text": "準備が遅れている場合に、作業割当の変更、もしくは作業指示を行っている"}, {"code": "09-03-01-3", "text": "ピーク売上が計画から大きく外れた時の対応を事前にシミュレーションしている"}]}, {"name": "2 ピーク時間帯", "viewpoints": [{"code": "09-03-02-1", "text": "ピークに入ることを全従業員に伝え、ピーク時間帯の作業割当に変更している"}, {"code": "09-03-02-2", "text": "流れが停滞しているところに入る、もしくは一時的に作業割当を変更している"}, {"code": "09-03-02-3", "text": "提供時間の遅れを見て、キッチンを支援する一時的な作業割当変更を行える"}, {"code": "09-03-02-4", "text": "ソート周辺、カウンター周辺を整理整頓し、ムダな停滞を減らしている"}, {"code": "09-03-02-5", "text": "クリーンアップの徹底と、手ぶらでカウンターに戻らないことを指示している"}, {"code": "09-03-02-6", "text": "状況に応じてフロア↔キッチン間の作業割当を変更している"}, {"code": "09-03-02-7", "text": "ピークの売上が計画を大きく下回った場合にトレーニングを進めることができる"}]}, {"name": "3 ピーク終了後", "viewpoints": [{"code": "09-03-03-1", "text": "先に客席がおおむね整っていることを確認してから片付け作業に入っている"}, {"code": "09-03-03-2", "text": "次のピーク(クローズ)までに行う作業を確認している"}, {"code": "09-03-03-3", "text": "片付け作業を整理し const ROSTER = [{"code": "9001", "name": "テスト　太郎", "grade": "", "rank": 9, "position": "ｽﾄｱﾁｰﾌ", "isStaff": true, "isOwnStore": true, "active": true, "hiredOn": "2016-04-01"}, {"code": "T0002", "name": "テスト　二郎", "grade": "LD3", "rank": 4, "position": "", "isStaff": false, "isOwnStore": true, "active": true, "hiredOn": "2022-07-16"}, {"code": "T0003", "name": "テスト　三子", "grade": "LD1", "rank": 2, "position": "", "isStaff": false, "isOwnStore": true, "active": true, "hiredOn": "2025-12-03"}, {"code": "T0004", "name": "テスト　四郎", "grade": "T", "rank": 1, "position": "", "isStaff": false, "isOwnStore": true, "active": true, "hiredOn": "2026-06-20"}, {"code": "T0005", "name": "テスト　五美", "grade": "PT1", "rank": 8, "position": "", "isStaff": false, "isOwnStore": false, "active": true, "hiredOn": "2019-09-01"}];
const STORE  = {code:"9999", name:"テスト店"};

/* 観点の状態: 0=未着手 1=セルフ済(トレーナー確認待ち) 2=トレーナー確認済
   マネージャー承認は観点ではなく「章」に対して行う(MGR_APPROVAL参照)。 */
const STAGE_LABEL = ["未着手", "セルフ済", "T確認済"];
const STAGE_MAX = 2;

/* 格付けマスタ。章を全部確定させると、その章の満点がまとめて入る(章単位加算)。
   満点は Basic 430 + Advance 560 = 990点。 */
/* 格付けマスタにはPT3(880点)の定義もあるが、現在は運用されていないため
   PT2を最上位として扱う(店長確認済み)。復活したら1行足せばよい。 */
const GRADES = [[0,"TRY"],[60,"LD1"],[180,"LD2"],[360,"LD3"],[480,"AS1"],
                [560,"AS2"],[640,"AS3"],[720,"PT1"],[800,"PT2"]];
const MAX_PT = 990;

/* ---- 索引をあらかじめ作る(532観点を毎回走査しないため) ---- */
const CHAPTERS = [];                 // 全章
const VP_OF_CH = new Map();          // 章コード -> 観点コード配列
const VP_OF_BU = new Map();          // 部コード -> 観点コード配列
MASTER.bu.forEach(bu => {
  const buCodes = [];
  bu.chapters.forEach(ch => {
    ch.buCode = bu.code; ch.buName = bu.name;
    CHAPTERS.push(ch);
    const codes = ch.sections.flatMap(s => s.viewpoints.map(v => v.code));
    VP_OF_CH.set(ch.code, codes);
    buCodes.push(...codes);
  });
  VP_OF_BU.set(bu.code, buCodes);
});
const CH_BY_CODE = new Map(CHAPTERS.map(c => [c.code, c]));

/* ---- 保存: 端末に残す。使えない環境ではメモリ上だけで動かす ---- */
const Store = (() => {
  const KEY = "salute:" + STORE.code;
  let mem = null;
  function read(){
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { mem = {}; }
    return mem;
  }
  function write(){
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {}
  }
  return {
    get: read,
    /* 章ごとのマネージャー承認。{code: {章コード: {basic:{d,by}, advance:{d,by}}}}
       観点の状態とは別に持つ。点数が入るのはここが埋まった時点。 */
    approval(code, ch, level, rec){
      const d = read();
      const all = d.__mgr || (d.__mgr = {});
      const person = all[code] || (all[code] = {});
      if (rec === undefined) return person[ch]?.[level] || null;
      const e = person[ch] || (person[ch] = {});
      if (rec === null) delete e[level]; else e[level] = rec;
      if (!Object.keys(e).length) delete person[ch];
      write();
    },
    /* 名簿への追記・変更。CSV取り込みで消えないよう、別のキーに持つ。 */
    crewPatch(code, patch){
      const d = read();
      const all = d.__crew || (d.__crew = {});
      if (patch === undefined) return all[code] || null;
      all[code] = Object.assign({}, all[code], patch);
      write();
    },
    crewPatches(){ return read().__crew || {}; },
    lastCrew(v){
      const d = read();
      if (v === undefined) return d.__last || null;
      d.__last = v; write();
    },
    set(code, vp, level, stage, date, sendBack, by){
      const d = read();
      const person = d[code] || (d[code] = {});
      const entry = person[vp] || (person[vp] = {});
      const prev = entry[level] || {};
      if (stage === 0 && !sendBack) { delete entry[level]; }
      else {
        entry[level] = {s: stage, d: date || null};
        /* 承認者は段階ごとに残す。t=トレーナー承認者, m=マネージャー承認者。
           前の段階で記録した承認者は、進んでも消さない。 */
        if (prev.t) entry[level].t = prev.t;
        if (prev.m) entry[level].m = prev.m;
        if (by && stage === 2) entry[level].t = by;
        if (by && stage === 3) entry[level].m = by;
        /* 差し戻しは「誰かが判断して戻した」という事実。日付と理由を残す。
           次にその段階へ進めた時点で消える(対応済みとみなす)。 */
        if (sendBack) entry[level].b = {d: sendBack.date, r: sendBack.reason || "",
                                        by: sendBack.by || null};
      }
      if (!Object.keys(entry).length) delete person[vp];
      write();
    }
  };
})();

function stageOf(code, vp, level){
  if (code === "__last" || code === "__crew" || code === "__mgr") return 0;
  const e = Store.get()[code]?.[vp]?.[level];
  return e ? e.s : 0;
}
function doneDate(code, vp, level){
  return Store.get()[code]?.[vp]?.[level]?.d || null;
}
/* 差し戻しの記録。{d:日付, r:理由, by:差し戻した人} */
function sentBack(code, vp, level){
  return Store.get()[code]?.[vp]?.[level]?.b || null;
}
/* 承認者。kind は "t"(トレーナー) か "m"(マネージャー) */
function approver(code, vp, level, kind){
  return Store.get()[code]?.[vp]?.[level]?.[kind] || null;
}

/* その段階を承認できる人。
   トレーナー承認は「格付が2つ上以上」、マネージャー承認は社員のみ。
   後追い入力もあるので、出勤しているかどうかでは絞らない。 */
function approversFor(crew, toStage){
  const list = allCrew().filter(c => c.active !== false && c.code !== crew.code);
  if (toStage === 3) return list.filter(c => c.isStaff);
  return list.filter(c => c.isStaff || (c.rank && crew.rank && c.rank >= crew.rank + 2));
}

/* 直前に選んだ承認者を覚えておき、次の候補の先頭に出す。
   同じ人が続けて承認することが多いので、選ぶ手間がほぼ無くなる。 */
/* crewPatch は「オブジェクトを重ねる」入れ物なので、文字列をそのまま渡すと
   1文字ずつに分解されて入る({0:"R",1:"E"…})。必ず {v: コード} で包む。
   古い形(文字列を分解したもの)が残っていても v が無いので null になる。 */
function recentApprover(kind){
  const r = Store.crewPatch("__recent" + kind);
  return r && typeof r.v === "string" ? r.v : null;
}
function rememberApprover(kind, code){ Store.crewPatch("__recent" + kind, {v: code}); }
/* 端末の日付。toISOString はUTCに直してしまうため、日本時間の朝9時より前は
   前日の日付が入ってしまう。承認日は紙に書き写す値なので、必ず現地日付で作る。 */
function isoOf(d){
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function today(){ return isoOf(new Date()); }

/* その人が最後に何かを確定した日。クルー一覧で「動いているか」を見るために使う。 */
function lastTrainedOn(code){
  /* 観点の記録が1つも無くても、章の承認だけ入っていることがある
     (一括入力や取り込みで章から入った場合)。両方を見る。 */
  const person = Store.get()[code] || {};
  let latest = null;
  for (const vp of Object.keys(person)){
    for (const lv of ["basic","advance"]){
      const d = person[vp]?.[lv]?.d;
      if (d && (!latest || d > latest)) latest = d;
    }
  }
  const mgr = (Store.get().__mgr || {})[code] || {};
  for (const ch of Object.keys(mgr)){
    for (const lv of ["basic","advance"]){
      const d = mgr[ch]?.[lv]?.d;
      if (d && (!latest || d > latest)) latest = d;
    }
  }
  return latest;
}
/* 今日から何日前か。日付は端末の時計を基準にする。 */
function daysSince(iso){
  const ms = new Date(today()) - new Date(iso);
  return Math.round(ms / 86400000);
}

/* その人の承認待ち。chToDo にはマネージャー承認できる章を積む。 */
function pendingOf(code, opt){
  const crew = typeof code === "object" ? code : findCrew(code);
  const id = crew ? crew.code : code;
  let trainer = 0;
  const mgr = [], tr = [];
  for (const bu of MASTER.bu){
    for (const ch of bu.chapters){
      for (const lv of (ch.hasAdvance ? ["basic","advance"] : ["basic"])){
        if (isChApproved(id, ch.code, lv)) continue;
        if (lv === "advance" && !isChApproved(id, ch.code, "basic")) continue;
        const vps = VP_OF_CH.get(ch.code);
        const self = vps.filter(v => stageOf(id, v, lv) === 1).length;
        const pt = lv === "basic" ? (ch.basicMaxPt||0) : (ch.advanceMaxPt||0);
        trainer += self;
        /* トレーナー確認待ちも章単位でまとめる。作業は章ごとに進むため。 */
        if (self) tr.push({bu, ch, lv, pt, left: self});
        if (vps.every(v => stageOf(id, v, lv) >= STAGE_MAX)) mgr.push({bu, ch, lv, pt});
      }
    }
  }
  /* 残りが少ない章を上に。早く片付くものから手をつけられる */
  tr.sort((a, b) => a.left - b.left);
  return {trainer, mgr, tr, mgrPt: mgr.reduce((s2, m) => s2 + m.pt, 0)};
}

/* 章のマネージャー承認 */
function chApproval(code, chCode, level){ return Store.approval(code, chCode, level); }
function isChApproved(code, chCode, level){ return !!chApproval(code, chCode, level); }

/* その章のその水準が、マネージャー承認を出せる状態か。
   配下の観点がすべてトレーナー確認済(状態2)になっていることが条件。 */
function readyForMgr(code, ch, level){
  if (level === "advance" && !ch.hasAdvance) return false;
  if (level === "advance" && !isChApproved(code, ch.code, "basic")) return false;
  if (isChApproved(code, ch.code, level)) return false;
  return VP_OF_CH.get(ch.code).every(v => stageOf(code, v, level) >= STAGE_MAX);
}

/* 確定した観点の数。章にAdvanceがある場合はBasic/Advanceの両方を1件ずつ数える */
function doneCount(code, vpCodes){
  let done = 0, total = 0;
  for (const vp of vpCodes){
    const ch = CH_BY_CODE.get(vp.slice(0,5));
    const levels = ch && ch.hasAdvance ? ["basic","advance"] : ["basic"];
    for (const lv of levels){
      total++;
      if (stageOf(code, vp, lv) >= STAGE_MAX) done++;
    }
  }
  return {done, total};
}

/* 獲得ポイント。章の観点が「全部」確定して初めて、その章の満点が入る。
   途中では1点も入らない代わりに、最後の1つを確定した瞬間にまとめて動く。 */
function pointsOf(code){
  let pt = 0;
  for (const ch of CHAPTERS){
    if (isChApproved(code, ch.code, "basic")) pt += ch.basicMaxPt || 0;
    if (ch.hasAdvance && isChApproved(code, ch.code, "advance")) pt += ch.advanceMaxPt || 0;
  }
  return pt;
}
/* いまの格付と、次の格付までの残り */
function gradeAt(pt){
  let cur = GRADES[0], next = null;
  for (let i = 0; i < GRADES.length; i++){
    if (pt >= GRADES[i][0]) { cur = GRADES[i]; next = GRADES[i+1] || null; }
  }
  return {grade: cur[1], base: cur[0], next: next ? next[1] : null,
          nextAt: next ? next[0] : null};
}
/* その章で既に獲得しているポイント */
function chapterEarned(code, ch){
  let pt = 0;
  if (isChApproved(code, ch.code, "basic")) pt += ch.basicMaxPt || 0;
  if (ch.hasAdvance && isChApproved(code, ch.code, "advance")) pt += ch.advanceMaxPt || 0;
  return pt;
}

/* その章で、あと何項目確定すれば点が入るか */
function chapterPending(code, ch){
  const vps = VP_OF_CH.get(ch.code);
  const b = isChApproved(code, ch.code, "basic")
    ? 0 : vps.filter(v => stageOf(code, v, "basic") < STAGE_MAX).length;
  const a = !ch.hasAdvance || isChApproved(code, ch.code, "advance")
    ? 0 : vps.filter(v => stageOf(code, v, "advance") < STAGE_MAX).length;
  return {basicLeft: b, advanceLeft: a};
}

/* ---- 画面の状態 ---- */
/* 入口はクルー本人の画面。前回開いた人を覚えておき、次もそこから始める。
   店長が全員を見るための名簿は「切り替え」から入る位置に下げる。 */

const LAST_CREW = LAST ? (ROSTER.find(c => c.code === LAST) || null) : null;
let view = LAST_CREW ? {name:"home", crew:LAST_CREW} : {name:"crew"};
const $main = document.getElementById("main");

  document.getElementById("back").hidden = !canBack;

/* 見出し右のアイコン。setHeader のあとに呼ぶ(setHeaderが消すため)。 */

  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
  + ' stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>'
  + '<path d="M7 9l5-5 5 5"/><path d="M12 4v11"/></svg>';

  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
  + ' stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">'

  + '<path d="M20 21v-4"/><path d="M20 13V3"/><path d="M1 15h6"/><path d="M9 8h6"/>'
  + '<path d="M17 17h6"/></svg>';
function headerAction(label, svg, onClick){
  const b = el("button");
  b.setAttribute("aria-label", label);
  b.innerHTML = svg;
  b.onclick = onClick;
  document.getElementById("acts").appendChild(b);
  return b;
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function chevron(){
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("class","chev"); s.setAttribute("width","18");
  s.setAttribute("height","18"); s.setAttribute("viewBox","0 0 24 24");
  s.innerHTML = '<path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" '+
                'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  return s;
}
/* 「◯pt」の表示。earned が真なら緑(もう入っている)、偽なら灰(まだ入らない)。
   max を渡すと「獲得/満点」になり、分子を大きく、分母を小さく添える。 */
function ptsTag(pt, earned, max){
  const w = el("span","pts");
  w.appendChild(el("em", earned ? "on" : null, String(pt)));
  if (max != null) w.appendChild(el("s", null, "/" + max));
  w.appendChild(el("i", earned ? "on" : null, "pt"));
  return w;
}

function meter(done, total){
  const m = el("div","meter");
  const t = el("div","track");
  const f = el("div","fill");
  f.style.width = (total ? done/total*100 : 0) + "%";
  t.appendChild(f); m.appendChild(t);
  m.appendChild(el("span","frac", done + "/" + total));
  return m;
}

/* ---- ① クルー一覧 ---- */
let crewQuery = "";
let showRetired = false;
/* 一括入力モード。オンの間は、1タップでセルフ〜マネージャー承認までまとめて記録する。
   承認者は最初に1回だけ選び、以降その人として記録する。 */
let bulk = null;   // {trainer, manager} いずれも従業員コード

/* 表示に使う名簿。CSVで取り込んだROSTERに、端末側の追記(新規・退職・格付変更)を重ねる。
   CSVを入れ直しても端末側の変更が消えないよう、保存は別のキーに分けている。 */
function allCrew(){
  const patches = Store.crewPatches();
  const list = ROSTER.map(c => Object.assign({}, c, patches[c.code] || {}));
  const known = new Set(ROSTER.map(c => c.code));
  for (const [code, p] of Object.entries(patches)){
    /* __recentt・__period など、名簿ではない覚え書きは同じ入れ物に入っている。
       これを弾かないと、氏名のない行が一覧と承認者の候補に出てしまう。 */
    if (code.startsWith("__")) continue;
    if (!known.has(code)) list.push(Object.assign({code, active: true}, p));
  }
  return list;
}
function findCrew(code){ return allCrew().find(c => c.code === code) || null; }

/* 氏名・従業員コード・格付のどれでも引っかかるようにする。
   氏名は姓と名の間の空白(全角・半角)を無視して比べる。 */
function matchCrew(c, q){
  if (!q) return true;
  const norm = t => String(t || "").replace(/[\s\u3000]/g, "").toLowerCase();
  const key = norm(c.name) + norm(c.code) + norm(c.grade) + norm(c.position);
  return key.includes(norm(q));
}

/* 検索欄は作り直さない。作り直すとIMEの変換が壊れる(「た」→「たた」)。
   一度だけ作って使い回し、絞り込みの結果はリスト側だけを描き替える。 */
let searchEl = null, searchInput = null, listEl = null, composing = false;

function buildSearch(){
  const wrap = el("div","search");
  const box = el("div","box");
  box.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" '+
    'stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
  const input = document.createElement("input");
  input.type = "text";
  input.autocapitalize = "off";
  input.autocomplete = "off";
  input.placeholder = "氏名・従業員コード・格付で探す";
  /* 変換中は絞り込みを止める。確定した時点で1回だけ走らせる。 */
  input.addEventListener("compositionstart", () => { composing = true; });
  input.addEventListener("compositionend", () => {
    composing = false;
    crewQuery = input.value;
    renderCrewList();
  });
  input.addEventListener("input", () => {
    if (composing) return;
    crewQuery = input.value;
    renderCrewList();
  });
  box.appendChild(input);

  const clr = el("button","clear");
  clr.setAttribute("aria-label","検索をやめる");
  clr.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="2.4" stroke-linecap="round">'+
    '<path d="M6 6l12 12M18 6L6 18"/></svg>';
  clr.onclick = () => {
    input.value = ""; crewQuery = ""; renderCrewList(); input.focus();
  };
  box.appendChild(clr);

  wrap.appendChild(box);
  searchEl = wrap; searchInput = input;
  return wrap;
}

function renderCrew(){
  $main.innerHTML = "";
  if (!searchEl) buildSearch();
  searchInput.value = crewQuery;
  searchEl.querySelector(".clear").style.visibility = crewQuery ? "visible" : "hidden";
  $main.appendChild(searchEl);
  listEl = el("div","list");
  $main.appendChild(listEl);
  renderCrewList();
}

/* 絞り込み結果だけを描き替える。検索欄には触らない。 */
function renderCrewList(){
  if (!listEl) return;
  const first = !Store.lastCrew();
  const roster = allCrew();
  const pool = roster.filter(c => showRetired ? !c.active : c.active !== false);
  const hits = pool.filter(c => matchCrew(c, crewQuery));
  const retiredCount = roster.filter(c => c.active === false).length;

  setHeader(STORE.code + " " + STORE.name,
            showRetired ? "退職したクルー"
                        : (first ? "自分を選ぶ" : "クルーを切り替える"),
            hits.length + "名", !first);
  searchEl.querySelector(".clear").style.visibility = crewQuery ? "visible" : "hidden";

  listEl.innerHTML = "";
  if (!hits.length){
    const e = el("div","empty");
    e.appendChild(el("b", null, "見つかりません"));
    e.append("氏名の漢字か、従業員コード・格付で探してみてください");
    listEl.appendChild(e);
    return;
  }

  const groups = [["自店", hits.filter(c => c.isOwnStore !== false)],
                  ["ヘルプ", hits.filter(c => c.isOwnStore === false)]];
  for (const [label, list] of groups){
    if (!list.length) continue;
    listEl.appendChild(el("div","sec", label));
    for (const c of list){
      const row = el("button","row");
      const body = el("div","body");
      body.appendChild(el("div","name", c.name));

      const sub = el("div","sub");
      sub.append((c.grade || "格付未設定") + (c.isStaff ? "・社員" : ""));
      const last = lastTrainedOn(c.code);
      if (last){
        const n = daysSince(last);
        sub.appendChild(el("span", n >= 30 ? "stale" : "recent",
          "  最終 " + last.slice(5).replace("-","/")
          + (n === 0 ? "(今日)" : n === 1 ? "(昨日)" : "(" + n + "日前)")));
      } else {
        sub.appendChild(el("span","stale", "  記録なし"));
      }
      body.appendChild(sub);

      /* 承認待ちがあれば出す。マネージャー承認は点が入る直前なので緑で強調 */
      const pd = pendingOf(c);
      if (pd.mgr.length || pd.trainer){
        const bs = el("div","badges");
        if (pd.mgr.length)
          bs.appendChild(el("span","badge m",
            "M承認 " + pd.mgr.length + "章 +" + pd.mgrPt + "pt"));
        if (pd.trainer)
          bs.appendChild(el("span","badge t", "T確認 " + pd.trainer + "項目"));
        body.appendChild(bs);
      }
      row.appendChild(body);

      const pt = pointsOf(c.code);
      const gauge = el("div","gauge");
      const fr = el("span","frac");
      fr.appendChild(el("b", pt ? "on" : null, String(pt)));
      fr.append("点");
      gauge.appendChild(fr);
      gauge.appendChild(profileBars(c.code));
      row.appendChild(gauge);
      row.appendChild(chevron());
      row.onclick = () => {
        bulk = null;                 // 承認者は人ごとに選び直す
        Store.lastCrew(c.code); view = {name:"home", crew:c}; render();
      };
      listEl.appendChild(row);
    }
  }

  if (!showRetired){
    headerAction("エクスポート(印刷・Excel)", ICON_EXPORT, askExport);
    headerAction("評価月の決め方", ICON_TUNE, () => { view = {name:"settings"}; render(); });
    const add = el("button","switch","クルーを追加する");
    add.onclick = askAddCrew;
    listEl.appendChild(add);
  }
  if (retiredCount || showRetired){
    const t = el("button","switch",
      showRetired ? "在籍中のクルーに戻る" : "退職したクルーを見る(" + retiredCount + "名)");
    t.onclick = () => { showRetired = !showRetired; crewQuery = ""; searchInput.value = "";
                        renderCrewList(); };
    listEl.appendChild(t);
  }
}

/* 部ごとの到達度を10本の縦棒で示す */
function profileBars(code){
  const wrap = el("div","profile");
  for (const bu of MASTER.bu){
    const {done,total} = doneCount(code, VP_OF_BU.get(bu.code));
    const ratio = total ? done/total : 0;
    const bar = el("i");
    bar.style.height = Math.max(3, Math.round(ratio*20)) + "px";
    if (ratio > 0) bar.classList.add("on");
    bar.title = bu.name + " " + done + "/" + total;
    wrap.appendChild(bar);
  }
  return wrap;
}

/* ---- ② クルーのホーム: 点数・次の格付・部の一覧 ---- */
function renderHome(){
  const c = view.crew;
  const pt = pointsOf(c.code);
  const g = c.isStaff ? null : gradeAt(pt);
  setHeader("", STORE.code + " " + STORE.name, "", false);
  $main.innerHTML = "";

  const hero = el("div","hero");
  const who = el("div","who");
  who.appendChild(el("b", null, c.name));
  who.appendChild(el("span", null, c.isStaff ? (c.position || "社員") : (g.grade)));
  if (c.active === false) who.appendChild(el("span","retired","退職"));
  hero.appendChild(who);

  const ptRow = el("div","pt");
  ptRow.appendChild(el("em", null, String(pt)));
  ptRow.appendChild(el("i", null, "/ " + MAX_PT + " 点"));
  hero.appendChild(ptRow);

  if (c.isStaff){
    /* 社員の役職(SCF・MT1等)はポイントで上がるものではないので、
       格付の道のりは見せず、全体のどこまで進んだかだけを出す。 */
    const road = el("div","road");
    const f = el("div");
    f.style.width = (pt / MAX_PT * 100) + "%";
    road.appendChild(f);
    hero.appendChild(road);
    const ends = el("div","roadEnds");
    ends.appendChild(el("span", null, "全体の " + Math.round(pt / MAX_PT * 100) + "%"));
    ends.appendChild(el("span", null, "残り " + (MAX_PT - pt) + " 点"));
    hero.appendChild(ends);
  } else if (g && g.next){
    const need = g.nextAt - pt;
    const line = el("div","toNext");
    line.append(g.next + "まで あと ");
    line.appendChild(el("b", null, String(need)));
    line.append(" 点");
    hero.appendChild(line);

    const span = g.nextAt - g.base;
    const road = el("div","road");
    const f = el("div");
    f.style.width = Math.max(0, Math.min(100, (pt - g.base) / span * 100)) + "%";
    road.appendChild(f);
    hero.appendChild(road);
    const ends = el("div","roadEnds");
    ends.appendChild(el("span", null, g.grade + " " + g.base));
    ends.appendChild(el("span", null, g.next + " " + g.nextAt));
    hero.appendChild(ends);
  } else if (g){
    hero.appendChild(el("div","toNext","最上位の格付に到達しています"));
  }
  $main.appendChild(hero);

  /* 承認待ちはここでは件数だけ。中身は専用画面に分けた。
     クルー本人が見る画面なので、作業リストで埋めないようにする。 */
  const pd = pendingOf(c);
  if (pd.mgr.length || pd.trainer){
    const b = el("button","todobar");
    const t = el("div","txt");
    t.appendChild(el("div","t1","承認待ち"));
    const bits = [];
    if (pd.mgr.length) bits.push("マネージャー承認 " + pd.mgr.length + "章");
    if (pd.trainer) bits.push("トレーナー確認 " + pd.trainer + "項目");
    t.appendChild(el("div","t2", bits.join(" / ")));
    b.appendChild(t);
    if (pd.mgr.length) b.appendChild(el("span","badge m", "+" + pd.mgrPt + "pt"));
    b.appendChild(chevron());
    b.onclick = () => { view = {name:"todo", crew:c}; render(); };
    $main.appendChild(b);
  }

  /* 部の一覧。点が近い部を上に寄せて、次に手をつける場所が分かるようにする */
  const list = MASTER.bu.map(bu => {
    const d = doneCount(c.code, VP_OF_BU.get(bu.code));
    const near = bu.chapters.reduce((m, ch) => {
      const p = chapterPending(c.code, ch);
      if (p.basicLeft > 0) m = Math.min(m, p.basicLeft);
      else if (ch.hasAdvance && p.advanceLeft > 0) m = Math.min(m, p.advanceLeft);
      return m;
    }, Infinity);
    return {bu, d, near};
  });
  /* 並べ替えはしない。部・章の順序はSUBの体系そのものなので、
     日によって並びが変わると「どこにあったか」が覚えられなくなる。 */

  $main.appendChild(el("div","sec","取り組む領域"));
  for (const {bu, d, near} of list){
    const row = el("button","row");
    const body = el("div","body");
    body.appendChild(el("div","name", bu.name));

    const buMax = bu.chapters.reduce((s2, ch) =>
      s2 + (ch.basicMaxPt || 0) + (ch.hasAdvance ? (ch.advanceMaxPt || 0) : 0), 0);
    const buGot = bu.chapters.reduce((s2, ch) => s2 + chapterEarned(c.code, ch), 0);
    const m = meter(d.done, d.total);
    m.insertBefore(ptsTag(buGot, buGot > 0, buMax), m.querySelector(".frac"));
    body.appendChild(m);

    const waiting = bu.chapters.reduce((n, ch) =>
      n + (ch.hasAdvance ? ["basic","advance"] : ["basic"])
            .filter(lv => readyForMgr(c.code, ch, lv)).length, 0);
    if (waiting)
      body.appendChild(el("div","soon", "マネージャー承認待ち " + waiting + "章"));
    else if (buGot === buMax) body.appendChild(el("div","earned","すべて承認済み"));
    else if (d.done === d.total)
      body.appendChild(el("div","earned","トレーナー確認は完了"));
    else if (near !== Infinity && near <= 3)
      body.appendChild(el("div","soon","あと" + near + "項目でマネージャー承認できます"));
    row.appendChild(body);
    row.appendChild(chevron());
    row.onclick = () => { view = {name:"chapter", crew:c, bu}; render(); };
    $main.appendChild(row);
  }

  if (bulk){
    const b = el("button","switch","一括入力モードをやめる");
    b.onclick = () => { bulk = null; render(); };
    $main.appendChild(b);
  } else {
    const b = el("button","switch","一括入力モードにする");
    b.onclick = () => askBulk(c);
    $main.appendChild(b);
  }

  const sw = el("button","switch",
    c.isStaff ? "クルーの進み具合を見る" : "ほかのクルーに切り替える");
  sw.onclick = () => { view = {name:"crew"}; render(); };
  $main.appendChild(sw);

  /* 退職しても記録は消さない。一覧から隠すだけ。 */
  if (c.active === false){
    const b = el("button","switch","在籍に戻す");
    b.onclick = () => askRejoin(c);
    $main.appendChild(b);
  } else {
    const b = el("button","switch danger","退職にする");
    b.onclick = () => askRetire(c);
    $main.appendChild(b);
  }
}

/* ---- 承認待ちの専用画面 ---- */
function renderTodo(){
  const c = view.crew;
  const pd = pendingOf(c);
  setHeader(c.name, "承認待ち",
            (pd.mgr.length + pd.tr.length) + "章", true);
  $main.innerHTML = "";

  const section = (title, sub, list, kind) => {
    if (!list.length) return;
    const box = el("div","todo");
    const head = el("div","head");
    head.appendChild(el("b", null, title));
    head.append(sub);
    box.appendChild(head);
    for (const m of list){
      const it = el("button","item");
      const t = el("div","t1");
      t.append(m.ch.name);
      t.appendChild(el("div","t2",
        m.bu.name + " / " + (m.lv === "basic" ? "Basic" : "Advanced")));
      it.appendChild(t);
      if (kind === "m") it.appendChild(el("span","pt2", "+" + m.pt + "pt"));
      else it.appendChild(el("span","left", "あと" + m.left + "項目"));
      it.appendChild(chevron());
      it.onclick = () => { view = {name:"viewpoints", crew:c, bu:m.bu, ch:m.ch}; render(); };
      box.appendChild(it);
    }
    $main.appendChild(box);
  };

  /* 点が入るものを先に。次にトレーナー確認待ちを、残りの少ない順で。 */
  section("マネージャー承認", "押せば " + pd.mgrPt + "pt 入ります", pd.mgr, "m");
  section("トレーナー確認", "残りが少ない章から", pd.tr, "t");

  if (!pd.mgr.length && !pd.tr.length){
    const e = el("div","empty");
    e.appendChild(el("b", null, "承認待ちはありません"));
    e.append("章を開いてセルフチェックから進めてください");
    $main.appendChild(e);
  }
}

/* ---- ③ 章の一覧 ---- */
function renderChapter(){
  const {crew:c, bu} = view;
  const {done,total} = doneCount(c.code, VP_OF_BU.get(bu.code));
  setHeader(c.name, bu.name, done + "/" + total, true);
  $main.innerHTML = "";
  for (const ch of bu.chapters){
    const d = doneCount(c.code, VP_OF_CH.get(ch.code));
    const row = el("button","row");
    const body = el("div","body");
    body.appendChild(el("div","name", ch.name));

    /* この章で入るポイントを、分数(項目数)の左に大きく置く。
       章単位加算なので、獲得済みかどうかで色を変える。 */
    const chMax = (ch.basicMaxPt || 0) + (ch.hasAdvance ? (ch.advanceMaxPt || 0) : 0);
    const got = chapterEarned(c.code, ch);
    const m = meter(d.done, d.total);
    m.insertBefore(ptsTag(chMax, got === chMax), m.querySelector(".frac"));
    body.appendChild(m);

    /* SALSAからの判定材料。承認の可否は変えない(出すだけ)。 */
    const hint = hintOf(c.code, ch.code);
    if (hint) body.appendChild(el("div","busy", hintText(hint)));

    const p = chapterPending(c.code, ch);
    const lvs = ch.hasAdvance ? ["basic","advance"] : ["basic"];
    const ready = lvs.filter(lv => readyForMgr(c.code, ch, lv));
    if (ready.length)
      body.appendChild(el("div","soon", "マネージャー承認できます +"
        + ready.reduce((n, lv) => n + (lv === "basic"
            ? (ch.basicMaxPt||0) : (ch.advanceMaxPt||0)), 0) + "pt"));
    else if (p.basicLeft > 0)
      body.appendChild(el("div","soon",
        "トレーナー確認があと" + p.basicLeft + "項目"));
    else if (ch.hasAdvance && p.advanceLeft > 0)
      body.appendChild(el("div","soon",
        "Advance トレーナー確認があと" + p.advanceLeft + "項目"));
    else
      body.appendChild(el("div","earned", "承認済み"));

    row.appendChild(body);
    row.appendChild(chevron());
    row.onclick = () => { view = {name:"viewpoints", crew:c, bu, ch}; render(); };
    $main.appendChild(row);
  }
}

/* ---- ④ 観点(チェック) ---- */
function renderViewpoints(){
  const {crew:c, ch} = view;
  const d = doneCount(c.code, VP_OF_CH.get(ch.code));
  setHeader(c.name, ch.name, d.done + "/" + d.total, true);
  $main.innerHTML = "";

  if (bulk){
    const bar = el("div","bulkbar");
    const t = findCrew(bulk.trainer), m = findCrew(bulk.manager);
    bar.appendChild(el("b", null, "一括入力中"));
    bar.append("T " + (t ? t.name : "?") + " / M " + (m ? m.name : "?"));

/* 章のマネージャー承認欄。観点を全部トレーナー確認済にすると押せるようになる。 */
function mgrBox(crew, ch){
  const box = el("div","mgr");
  const levels = ch.hasAdvance ? ["basic","advance"] : ["basic"];
  for (const lv of levels){
    const row = el("div","lv");
    const pt = lv === "basic" ? (ch.basicMaxPt || 0) : (ch.advanceMaxPt || 0);
    row.appendChild(el("div","lvname", (lv === "basic" ? "Basic" : "Advanced")
                                       + " " + pt + "pt"));
    const ap = chApproval(crew.code, ch.code, lv);
    if (ap){
      const who = findCrew(ap.by);
      const st = el("div","state");
      st.appendChild(el("b", null, "承認済"));
      st.append(" " + (who ? who.name : ""));
      row.appendChild(st);
      row.appendChild(el("div","done", ap.d.slice(2).replaceAll("-","/")));
      /* 承認の取り消しは、押し間違いに備えて残す */
      const u = el("button","undo");
      u.setAttribute("aria-label","承認を取り消す");
      u.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" '+
        'stroke="currentColor" stroke-width="2.1" stroke-linecap="round" '+
        'stroke-linejoin="round"><path d="M3 7v6h6"/>'+
        '<path d="M3.5 13a9 9 0 1 0 2.3-6.4L3 9"/></svg>';
      u.onclick = () => { Store.approval(crew.code, ch.code, lv, null); render(); };
      row.appendChild(u);
    } else {
      const left = VP_OF_CH.get(ch.code)
        .filter(v => stageOf(crew.code, v, lv) < STAGE_MAX).length;
      const blocked = lv === "advance" && !isChApproved(crew.code, ch.code, "basic");
      row.appendChild(el("div","state",
        blocked ? "Basicの承認が先です"
                : left ? "トレーナー確認があと" + left + "項目" : "承認できます"));
      const b = el("button", null, "承認する");
      b.disabled = !readyForMgr(crew.code, ch, lv);
      b.onclick = () => bulk ? bulkApprove(crew, ch, lv) : askMgrApproval(crew, ch, lv);
      row.appendChild(b);
    }
    box.appendChild(row);
  }
  return box;
}

function viewpointRow(crew, ch, vp){
  const wrap = el("div","vp");
  wrap.appendChild(el("div","text", vp.text));
  const foot = el("div","foot");

  const levels = ch.hasAdvance ? ["basic","advance"] : ["basic"];
  const chips = el("div","chips");
  for (const lv of levels){
    const stage = stageOf(crew.code, vp.code, lv);
    const b = el("button","chip s"+stage + (ch.hasAdvance ? " lv" : ""));
    b.textContent = ch.hasAdvance
      ? (lv === "basic" ? "B" : "A") + " " + STAGE_LABEL[stage]
      : STAGE_LABEL[stage];
    /* Advanceは、同じ観点のBasicがトレーナー確認済になってから進める */
    const locked = lv === "advance" && stageOf(crew.code, vp.code, "basic") < STAGE_MAX;
    if (locked) b.disabled = true;
    b.onclick = () => {
      if (stage >= STAGE_MAX) return;
      const before = pointsOf(crew.code);
      advanceWithApprover(crew, vp, lv, stage, () => {
        const gained = pointsOf(crew.code) - before;
        render();
        if (gained > 0) celebrate(gained, crew.code);
      });
    };
    chips.appendChild(b);
  }
  foot.appendChild(chips);

  /* 一括入力中は、未確定の段階を1タップで確定まで進めるボタンを出す */
  if (bulk){
    const lv = levels.find(l => stageOf(crew.code, vp.code, l) < STAGE_MAX
      && !(l === "advance" && stageOf(crew.code, vp.code, "basic") < STAGE_MAX)
      && !isChApproved(crew.code, ch.code, l));
    if (lv){
      const q = el("button","bulk",
        "確認済にする" + (ch.hasAdvance ? "(" + (lv === "basic" ? "B" : "A") + ")" : ""));
      q.onclick = () => bulkConfirm(crew, vp, lv);
      foot.appendChild(q);
    }
  }

  const dt = doneDate(crew.code, vp.code, "basic") || doneDate(crew.code, vp.code, "advance");
  if (dt) foot.appendChild(el("span","done", dt.replaceAll("-","/")));

  /* 段階が1つでも進んでいれば、両方の操作を常に出す。
       戻す     … 自分の押し間違いを1段階取り消す。記録に残さない
       差し戻す … 承認者が判断して1段階下げる。日付と理由を残す
     どちらか一方しか出ないと、確定を差し戻せない・押し間違いを直せない、
     という取りこぼしが起きるため、条件で出し分けない。 */
  /* 操作の出し分け
       確定        … 「戻す」だけ。押し間違いを直す道は残す
       T待ち・M待ち … 「戻す」と「差し戻す」の両方
     差し戻しは承認者が判断して下げる動作なので、確定済みには出さない。 */
  const topLevel = [...levels].reverse()
        .find(lv => stageOf(crew.code, vp.code, lv) > 0);
  if (topLevel){
    const st = stageOf(crew.code, vp.code, topLevel);
    /* 章が承認済みなら、観点は動かせない(記録が確定しているため) */
    const frozen = isChApproved(crew.code, ch.code, topLevel);

    const u = el("button","undo");
    u.setAttribute("aria-label","ひとつ戻す");
    u.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" '+
      'stroke="currentColor" stroke-width="2.1" stroke-linecap="round" '+
      'stroke-linejoin="round"><path d="M3 7v6h6"/>'+
      '<path d="M3.5 13a9 9 0 1 0 2.3-6.4L3 9"/></svg>';
    u.onclick = () => {
      Store.set(crew.code, vp.code, topLevel, st-1, null);
      render();
    };
    if (!frozen){
      foot.appendChild(u);
      const btn = el("button","sendback","差し戻す");
      btn.onclick = () => askSendBack(crew, vp, topLevel);
      foot.appendChild(btn);
    }
  }

  wrap.appendChild(foot);

  /* 差し戻された観点は、理由とともにその場に出す */
  let backInfo = null, backLv = null;
  for (const lv of levels){
    const b = sentBack(crew.code, vp.code, lv);
    if (b){ backInfo = b; backLv = lv; }
  }
  if (backInfo){
    wrap.classList.add("sent");
    const note = el("div","backnote");
    note.appendChild(el("b", null, "差し戻し"));
    note.append(" " + backInfo.d.replaceAll("-","/")
      + (ch.hasAdvance ? "(" + (backLv === "basic" ? "Basic" : "Advance") + ")" : ""));
    if (backInfo.r) note.append(" / " + backInfo.r);
    wrap.appendChild(note);
  }

  if (levels.every(lv => stageOf(crew.code, vp.code, lv) >= STAGE_MAX))
    wrap.classList.add("is-done");
  return wrap;
}

/* 差し戻しの確認。理由は任意だが、残っていると次に何をすればよいかが伝わる。
   window.prompt は環境によって無効化されるため、画面内のシートで受け取る。 */
let sheetEls = null;
function ensureSheet(){
  if (sheetEls) return sheetEls;
  const bg = document.createElement("div"); bg.id = "sheetbg";
  const sh = document.createElement("div"); sh.id = "sheet";
  sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true");
  sh.innerHTML =
    '<h2>差し戻す</h2>' +
    '<div class="target"></div>' +
    '<label for="sbReason">理由(任意)</label>' +
    '<textarea id="sbReason" placeholder="できていなかったことを書くと、本人に伝わります"></textarea>' +
    '<div class="acts">' +
      '<button type="button" class="cancel">やめる</button>' +
      '<button type="button" class="confirm">差し戻す</button>' +
    '</div>';
  document.body.appendChild(bg); document.body.appendChild(sh);
  sheetEls = {bg, sh,
    target: sh.querySelector(".target"),
    input: sh.querySelector("#sbReason"),
    cancel: sh.querySelector(".cancel"),
    confirm: sh.querySelector(".confirm")};
  return sheetEls;
}

function askSendBack(crew, vp, lv){
  const cur = stageOf(crew.code, vp.code, lv);
  const kind = cur === 3 ? "m" : "t";
  const cands = approversFor(crew, cur);
  const recent = recentApprover(kind);
  const sorted = cands.slice().sort((a, b) =>
    (b.code === recent) - (a.code === recent) || (b.rank || 0) - (a.rank || 0));
  const labelOf = c => c.name + "(" + (c.position || c.grade) + ")";
  openSheet({
    title: "差し戻す",
    note: vp.text,
    reason: true,
    okLabel: "差し戻す",
    danger: true,
    fields: sorted.length ? [{key:"by", label:"差し戻す人",
                              options: sorted.map(labelOf)}] : [],
    onOk: (v) => {
      const picked = sorted.find(c => labelOf(c) === v.by);
      if (picked) rememberApprover(kind, picked.code);
      Store.set(crew.code, vp.code, lv, cur - 1, null,
                {date: today(), reason: v.reason, by: picked ? picked.code : null});
    },
  });
}

/* 汎用の入力シート。fields で項目を組み立て、OKで values を返す。
   window.prompt / confirm は環境によって無効化されるため、すべてこれで受ける。 */
function openSheet({title, note, fields = [], reason = false,
                    okLabel = "決定", danger = false, onOk}){
  const {bg, sh, target, input, cancel, confirm} = ensureSheet();
  sh.querySelector("h2").textContent = title;
  target.textContent = note || "";
  target.style.display = note ? "" : "none";

  /* 差し戻し用の理由欄と、追加用の項目欄を入れ替える */
  const label = sh.querySelector("label");
  const box = sh.querySelector(".fields") || (() => {
    const d = el("div","fields");
    sh.insertBefore(d, sh.querySelector(".acts"));
    return d;
  })();
  /* 理由欄は reason:true のときだけ。項目欄は fields があるときだけ。
     どちらも要らない確認だけのシート(退職など)では両方隠す。 */
  label.style.display = input.style.display = reason ? "" : "none";
  box.style.display = fields.length ? "" : "none";
  box.innerHTML = "";
  const inputs = {};
  for (const f of fields){
    const w = el("div","field");
    w.appendChild(el("label", null, f.label));
    let node;
    if (f.options){
      node = document.createElement("select");
      for (const o of f.options){
        const op = document.createElement("option");
        op.value = o; op.textContent = o;
        node.appendChild(op);
      }
      if (f.value) node.value = f.value;
    } else {
      node = document.createElement("input");
      node.type = f.type || "text";
      node.value = f.value || "";
      if (f.placeholder) node.placeholder = f.placeholder;
    }
    w.appendChild(node);
    if (f.note) w.appendChild(el("div","note", f.note));
    box.appendChild(w);
    inputs[f.key] = node;
  }
  if (reason) input.value = "";

  confirm.textContent = okLabel;
  confirm.className = "confirm " + (danger ? "danger" : "go");

  function close(){
    bg.classList.remove("show"); sh.classList.remove("show");
    cancel.onclick = confirm.onclick = bg.onclick = null;
  }
  cancel.onclick = close; bg.onclick = close;
  confirm.onclick = () => {
    const vals = {};
    for (const k of Object.keys(inputs)) vals[k] = inputs[k].value.trim();
    if (reason) vals.reason = input.value.trim();
    const err = onOk(vals);
    if (err){ alertInSheet(box, err); return; }   // 入力に不備があれば閉じない
    close(); render();
  };
  bg.classList.add("show"); sh.classList.add("show");
  setTimeout(() => {
    const first = fields.length ? Object.values(inputs)[0] : (reason ? input : null);
    if (first) first.focus();
  }, 260);
}

function alertInSheet(box, msg){
  let e = box.querySelector(".err");
  if (!e){ e = el("div","note err"); box.appendChild(e); }
  e.style.color = "var(--red)";
  e.textContent = msg;
}

/* 章のマネージャー承認。本の運用どおり、章に対して1回だけ行う。
   承認した時点でその章の満点が入り、スコアカードに書く日付がここで決まる。 */
function askMgrApproval(crew, ch, level){
  const managers = approversFor(crew, 3);
  if (!managers.length){
    openSheet({title:"マネージャー承認", okLabel:"閉じる", onOk:()=>{},
      note:"承認できる社員が名簿にいません。店舗情報の社員欄を確認してください。"});
    return;
  }
  const labelOf = c => c.name + "(" + (c.position || c.grade) + ")";
  const recent = recentApprover("m");
  const sorted = managers.slice().sort((a,b) => (b.code === recent) - (a.code === recent));
  const pt = level === "basic" ? (ch.basicMaxPt || 0) : (ch.advanceMaxPt || 0);
  openSheet({
    title: "マネージャー承認",
    note: ch.name + "(" + (level === "basic" ? "Basic" : "Advanced") + ")"
        + " を承認します。" + pt + "pt が入ります。"
        + (hintOf(crew.code, ch.code)
           ? "\nSALSA: " + hintText(hintOf(crew.code, ch.code)) : ""),
    okLabel: "承認する",
    fields: [{key:"by", label:"承認する社員", options: sorted.map(labelOf),
              note:"社員のみ承認できます"}],
    onOk: (v) => {
      const picked = sorted.find(c => labelOf(c) === v.by);
      if (!picked) return "承認する人を選んでください";
      rememberApprover("m", picked.code);
      const before = pointsOf(crew.code);
      Store.approval(crew.code, ch.code, level, {d: today(), by: picked.code});
      const gained = pointsOf(crew.code) - before;
      setTimeout(() => { if (gained > 0) celebrate(gained, crew.code); }, 80);
    },
  });
}

/* 一括入力モードの開始。承認者を先に決めてしまう。 */
function askBulk(crew){
  const trainers = approversFor(crew, 2);
  const managers = approversFor(crew, 3);
  if (!managers.length){
    openSheet({title:"一括入力", okLabel:"閉じる", onOk:()=>{},
      note:"承認できる社員が名簿にいません。店舗情報の社員欄を確認してください。"});
    return;
  }
  const labelOf = c => c.name + "(" + (c.position || c.grade) + ")";
  const tList = trainers.length ? trainers : managers;
  openSheet({
    title: "一括入力モード",
    note: crew.name + " の既に承認済みの項目を、まとめて記録します。"
        + "1タップで確定まで進みます。",
    okLabel: "始める",
    fields: [
      {key:"t", label:"トレーナー承認者", options: tList.map(labelOf)},
      {key:"m", label:"マネージャー承認者", options: managers.map(labelOf),
       note:"記録に残る承認者です。実際に承認した人を選んでください。"},
    ],
    onOk: (v) => {
      const t = tList.find(c => labelOf(c) === v.t);
      const m = managers.find(c => labelOf(c) === v.m);
      if (!t || !m) return "承認者を選んでください";
      bulk = {trainer: t.code, manager: m.code};
    },
  });
}

/* 一括入力中の章承認。承認者は最初に選んだ人をそのまま使う。 */
function bulkApprove(crew, ch, lv){
  const before = pointsOf(crew.code);
  Store.approval(crew.code, ch.code, lv, {d: today(), by: bulk.manager});
  const gained = pointsOf(crew.code) - before;

/* 承認者を選んでから進める。セルフ(→T待ち)は本人の申告なので選ばせない。 */
function advanceWithApprover(crew, vp, lv, stage, after){
  if (stage + 1 === 1){            // 未着手 → セルフ済(本人の申告)
    Store.set(crew.code, vp.code, lv, 1, null);
    after && after(); return;
  }
  const toStage = 2;               // セルフ済 → トレーナー確認済
  const kind = "t";
  const cands = approversFor(crew, toStage);
  if (!cands.length){
    openSheet({
      title: "トレーナー確認",
      note: crew.name + "(" + (crew.grade || "格付未設定") +
            ")を確認できる人がいません。格付が2つ上以上のクルーが必要です。",
      okLabel: "閉じる", onOk: () => {},
    });
    return;
  }
  const recent = recentApprover(kind);
  const sorted = cands.slice().sort((a, b) =>
    (b.code === recent) - (a.code === recent) || (b.rank || 0) - (a.rank || 0));
  openSheet({
    title: "トレーナー確認",
    note: vp.text,
    okLabel: "確認した",
    fields: [{
      key: "by", label: "確認するトレーナー",
      options: sorted.map(c => c.name + "(" + (c.position || c.grade) + ")"),
      note: "格付が2つ上以上の人が候補に出ます",
    }],
    onOk: (v) => {
      const picked = sorted[sorted.findIndex(c =>
        c.name + "(" + (c.position || c.grade) + ")" === v.by)];
      if (!picked) return "承認する人を選んでください";
      rememberApprover(kind, picked.code);
      Store.set(crew.code, vp.code, lv, 2, today(), null, picked.code);
      after && after();
    },
  });
}
